function bindNotes(ta, setter) {
  let t;
  ta.oninput = () => { clearTimeout(t); t = setTimeout(() => { setter(ta.value); save(); const n = document.getElementById('savedNote'); if (n) n.textContent = 'Spremljeno'; }, 500); };
}

function openSubjectSheet(existing, presetSem) {
  let color = existing ? existing.color : PALETTE[state.subjects.length % PALETTE.length];
  const e = existing || {};
  const semOpts = `<option value="">— bez semestra —</option>` + [1, 2, 3, 4, 5, 6].map(n => `<option value="${n}" ${(e.sem || presetSem) === n ? 'selected' : ''}>${Math.ceil(n / 2)}. godina · ${semName(n)}</option>`).join('');
  openSheet(existing ? 'Uredi kolegij' : 'Novi kolegij', `
    <div class="field"><label>Naziv kolegija</label><input id="f-name" value="${esc(e.name || '')}" placeholder="npr. Strukture podataka i algoritmi" autocomplete="off"></div>
    <div class="field"><label>Profesor</label><input id="f-prof" value="${esc(e.prof || '')}" placeholder="npr. prof. Cerinski" autocomplete="off"></div>
    <div class="field"><label>Godina i semestar</label><select id="f-sem">${semOpts}</select></div>
    <div class="row2"><div class="field"><label>ECTS</label><input id="f-ects" inputmode="numeric" value="${e.ects || ''}" placeholder="npr. 6"></div><div class="field"><label>Nastava (termin)</label><input id="f-nast" value="${esc(e.nastava || '')}" placeholder="npr. 7.–19. 12." autocomplete="off"></div></div>
    <div class="field"><label>Boja</label>${swatches(color)}</div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn danger" id="f-del">Obriši kolegij</button>` : ''}
  `);
  bindSwatches(c => color = c);
  if (!existing) setTimeout(() => document.getElementById('f-name').focus(), 280);
  document.getElementById('f-save').onclick = () => {
    const name = document.getElementById('f-name').value.trim(); if (!name) return toast('Upiši naziv');
    const sv = document.getElementById('f-sem').value, ects = parseInt(document.getElementById('f-ects').value, 10);
    const d = { name, color, prof: document.getElementById('f-prof').value.trim(), sem: sv ? +sv : null, ects: ects > 0 ? ects : null, nastava: document.getElementById('f-nast').value.trim() };
    if (existing) Object.assign(existing, d); else state.subjects.push({ id: uid(), notes: '', status: 'nije', grade: null, points: [], links: [], ...d });
    save(); closeSheet(); render(); toast('Spremljeno');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    const n = state.faksTasks.filter(t => t.subjectId === existing.id).length;
    if (!confirm(`Obrisati kolegij "${existing.name}"${n ? ` i njegovih ${n} zadataka` : ''}? Rokovi iz kalendara ostaju.`)) return;
    state.subjects = state.subjects.filter(x => x.id !== existing.id);
    state.faksTasks = state.faksTasks.filter(t => t.subjectId !== existing.id);
    state.events.forEach(ev => { if (ev.subjectId === existing.id) ev.subjectId = ''; });
    ui.subject = null; save(); closeSheet(); render(); toast('Obrisano');
  };
}

/* --- Tečajevi --- */
function renderCourse() {
  const c = courseById(ui.course);
  if (!c) { ui.course = null; return render(); }
  c.lessons ||= []; c.sessions ||= [];
  setHeader(`${c.emoji || '💻'} ${c.name}`, c.archived ? 'Završen tečaj' : 'Tečaj', { back: true, btn: { ico: 'pencil', label: 'Uredi tečaj', onclick: () => openCourseSheet(c) } });
  const p = courseProgress(c);
  const doneN = c.lessons.filter(l => l.done).length;
  const total = c.sessions.reduce((a, x) => a + (x.minutes || 0), 0);
  const next = c.lessons.find(l => !l.done);
  const seg = ui.courseSeg;

  let body = '';
  if (seg === 'plan') {
    body = c.lessons.length ? `<div class="card tight">${c.lessons.map(l => `<div class="item ${l.done ? 'done' : ''}" data-les="${l.id}">
        <span class="check ${l.done ? 'on' : ''}">${l.done ? icon('check', 14, 3) : ''}</span>
        <div class="main"><div class="title wrap">${esc(l.text)}</div>${l.doneDate ? `<div class="meta">završeno ${shortDate(l.doneDate)}</div>` : ''}</div></div>`).join('')}</div>`
      : `<div class="card">${emptyArt('laptop', 'složi plan', 'Dodaj module ili lekcije na +. Možeš ih upisati više odjednom, svaku u svoj red.')}</div>`;
  } else if (seg === 'ucenje') {
    const list = c.sessions.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
    body = list.length ? `<div class="card tight">${list.map(x => `<button class="log" data-ses="${x.id}"><div class="d">${niceDate(x.date)} · ${fmtMin(x.minutes)}</div>${x.text ? `<div class="t">${esc(x.text)}</div>` : ''}</button>`).join('')}</div>`
      : `<div class="card">${emptyArt('walk', 'zapiši učenje', 'Svaki put kad učiš, dodaj koliko dugo i što si radila.')}</div>`;
  } else {
    body = `<div class="card"><textarea class="notes-area" id="notes" placeholder="Bilješke, linkovi, zadaci s instrukcija…">${esc(c.notes || '')}</textarea></div>`;
  }

  view.innerHTML = `
    <div class="card status-card" style="border-left:4px solid ${c.color}">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <div class="kicker" style="color:${c.color}">Napredak</div>
        <div style="font-weight:800;font-size:30px;letter-spacing:-.03em">${p} %</div>
      </div>
      <div class="progress" style="height:12px"><span style="width:${p}%;background:${c.color}"></span></div>
      <div class="note" style="margin-top:8px">${c.lessons.length ? `${doneN} od ${c.lessons.length} lekcija` : 'Još nema plana'} · ${fmtMin(total)} učenja${c.goal ? ` · cilj ${shortDate(c.goal)} (${countdown(c.goal)})` : ''}</div>
      ${next ? `<div style="margin-top:8px;font-weight:650">→ Sljedeće: ${esc(next.text)}</div>` : (c.lessons.length ? `<div style="margin-top:8px;font-weight:650">🎉 Sve lekcije gotove!</div>` : '')}
    </div>
    <div class="seg" id="cseg">
      <button data-s="plan" class="${seg === 'plan' ? 'on' : ''}">Plan</button>
      <button data-s="ucenje" class="${seg === 'ucenje' ? 'on' : ''}">Učenje</button>
      <button data-s="biljeske" class="${seg === 'biljeske' ? 'on' : ''}">Bilješke</button>
    </div>
    ${seg === 'biljeske' ? `<div class="sec-head" style="margin-top:0"><span></span><span class="note" id="savedNote" style="margin:0"></span></div>` : ''}
    ${body}
  `;
  document.getElementById('cseg').onclick = ev => { const b = ev.target.closest('[data-s]'); if (b) { ui.courseSeg = b.dataset.s; render(); } };
  view.querySelectorAll('[data-les]').forEach(el => el.onclick = ev => {
    const l = c.lessons.find(x => x.id === el.dataset.les); if (!l) return;
    if (ev.target.closest('.check')) { l.done = !l.done; l.doneDate = l.done ? todayStr() : null; save(); render(); if (l.done && courseProgress(c) === 100) toast('Bravo! Tečaj gotov 🎓'); }
    else openTextSheet('Uredi lekciju', l.text, '', v => { l.text = v; }, () => { c.lessons = c.lessons.filter(x => x.id !== l.id); }, true);
  });
  view.querySelectorAll('[data-ses]').forEach(el => el.onclick = () => { const x = c.sessions.find(s => s.id === el.dataset.ses); if (x) openSessionSheet(c, x); });
  const ta = document.getElementById('notes'); if (ta) bindNotes(ta, v => { c.notes = v; });
}

function openCourseSheet(existing) {
  let color = existing ? existing.color : PALETTE[(state.courses.length + 3) % PALETTE.length];
  openSheet(existing ? 'Uredi tečaj' : 'Novi tečaj', `
    <div class="row2" style="grid-template-columns:80px 1fr">
      <div class="field"><label>Emoji</label><input id="f-emoji" value="${esc(existing ? existing.emoji : '💻')}" style="text-align:center;font-size:22px" autocomplete="off"></div>
      <div class="field"><label>Naziv</label><input id="f-name" value="${esc(existing ? existing.name : '')}" placeholder="npr. Google Data Analytics" autocomplete="off"></div>
    </div>
    <div class="field"><label>Gdje / s kim</label><input id="f-prov" value="${esc(existing ? existing.provider || '' : '')}" placeholder="npr. Coursera, instrukcije s Markom" autocomplete="off"></div>
    <div class="field"><label>Cilj do (neobavezno)</label><input id="f-goal" type="date" value="${existing ? existing.goal || '' : ''}"></div>
    ${existing ? '' : `<div class="field"><label>Plan lekcija (neobavezno)</label><textarea id="f-lessons" placeholder="Svaki red = jedna lekcija ili modul&#10;npr.&#10;1. Foundations&#10;2. Ask Questions&#10;3. Prepare Data"></textarea></div>`}
    <div class="field"><label>Boja</label>${swatches(color)}</div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn ghost" id="f-arch">${existing.archived ? 'Vrati u aktivne' : 'Označi kao završen 🎓'}</button><button class="btn danger" id="f-del">Obriši tečaj</button>` : ''}
  `);
  bindSwatches(x => color = x);
  if (!existing) setTimeout(() => document.getElementById('f-name').focus(), 280);
  document.getElementById('f-save').onclick = () => {
    const name = document.getElementById('f-name').value.trim(); if (!name) return toast('Upiši naziv');
    const data = { name, color, emoji: document.getElementById('f-emoji').value.trim() || '💻', provider: document.getElementById('f-prov').value.trim(), goal: document.getElementById('f-goal').value };
    if (existing) Object.assign(existing, data);
    else {
      const lessons = document.getElementById('f-lessons').value.split('\n').map(x => x.trim()).filter(Boolean).map((text, i) => ({ id: uid() + i, text, done: false }));
      const c = { id: uid(), ...data, lessons, sessions: [], notes: '', created: Date.now() };
      state.courses.push(c); ui.course = c.id; ui.courseSeg = 'plan'; ui.learnSeg = 'tecajevi';
    }
    save(); closeSheet(); render(); toast('Spremljeno');
  };
  if (existing) {
    document.getElementById('f-arch').onclick = () => { existing.archived = !existing.archived; save(); closeSheet(); render(); if (existing.archived) toast('Čestitam! 🎓'); };
    document.getElementById('f-del').onclick = () => {
      if (!confirm(`Obrisati tečaj "${existing.name}" s planom i dnevnikom učenja?`)) return;
      state.courses = state.courses.filter(x => x.id !== existing.id); ui.course = null; save(); closeSheet(); render(); toast('Obrisano');
    };
  }
}

function openLessonsSheet(c) {
  openSheet('Nove lekcije', `
    <div class="field"><label>Svaki red = jedna lekcija</label><textarea id="f-text" placeholder="npr.&#10;Petlje&#10;Funkcije&#10;Rekurzija"></textarea></div>
    <button class="btn" id="f-save">Dodaj</button>
  `);
  setTimeout(() => document.getElementById('f-text').focus(), 280);
  document.getElementById('f-save').onclick = () => {
    const lines = document.getElementById('f-text').value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length) return toast('Upiši barem jednu lekciju');
    lines.forEach((text, i) => c.lessons.push({ id: uid() + i, text, done: false }));
    save(); closeSheet(); render(); toast(`Dodano: ${lines.length}`);
  };
}

function openSessionSheet(c, existing) {
  const presets = [15, 30, 45, 60, 90, 120];
  let minutes = existing ? existing.minutes : 60;
  openSheet(existing ? 'Uredi učenje' : 'Zapiši učenje', `
    <div class="field"><label>Koliko dugo</label>
      <div class="chips" id="f-min">${presets.map(m => `<button class="chip ${m === minutes ? 'on' : ''}" data-m="${m}">${fmtMin(m)}</button>`).join('')}</div>
      <input id="f-mins" inputmode="numeric" value="${minutes}" style="margin-top:8px" placeholder="minuta">
    </div>
    <div class="field"><label>Datum</label><input id="f-date" type="date" value="${existing ? existing.date : todayStr()}"></div>
    <div class="field"><label>Što sam radila</label><textarea id="f-text" placeholder="npr. Modul 2, SQL vježbe; na instrukcijama radili petlje">${esc(existing ? existing.text : '')}</textarea></div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  const inp = document.getElementById('f-mins');
  document.getElementById('f-min').onclick = ev => {
    const b = ev.target.closest('[data-m]'); if (!b) return;
    inp.value = b.dataset.m; document.querySelectorAll('#f-min .chip').forEach(x => x.classList.toggle('on', x === b));
  };
  inp.oninput = () => document.querySelectorAll('#f-min .chip').forEach(x => x.classList.toggle('on', x.dataset.m === inp.value));
  document.getElementById('f-save').onclick = () => {
    const m = parseInt(inp.value, 10); if (!(m > 0)) return toast('Upiši minute');
    const data = { minutes: m, date: document.getElementById('f-date').value || todayStr(), text: document.getElementById('f-text').value.trim() };
    if (existing) Object.assign(existing, data); else c.sessions.push({ id: uid(), created: Date.now(), ...data });
    save(); closeSheet(); render(); toast('Spremljeno');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati ovaj zapis?')) return;
    c.sessions = c.sessions.filter(x => x.id !== existing.id); save(); closeSheet(); render();
  };
}

/* ===================== MOMENTS ===================== */
const starsHtml = n => n ? `<span class="mstars">${'★'.repeat(n)}<span style="opacity:.25">${'★'.repeat(5 - n)}</span></span>` : '';

function renderMoments() {
  setHeader('Moments', 'The archive', { back: true });
  const seg = ui.momSeg;
  const tags = state.momentTags;
  const done = state.moments.filter(m => !m.wish && m.date);
  const wishes = state.moments.filter(m => m.wish);
  const segHtml = `<div class="seg" id="mseg">
    <button data-s="dnevnik" class="${seg === 'dnevnik' ? 'on' : ''}">Dnevnik</button>
    <button data-s="zelje" class="${seg === 'zelje' ? 'on' : ''}">Želim${wishes.length ? ` (${wishes.length})` : ''}</button>
  </div>`;
  const tagFilter = list => `<div class="quick" style="margin:0 -16px 12px">
      <button class="${ui.momTag ? '' : 'on'}" data-tag="">Sve</button>
      ${tags.filter(t => list.some(m => m.tag === t.id)).map(t => `<button class="${ui.momTag === t.id ? 'on' : ''}" data-tag="${t.id}">${t.emoji} ${esc(t.name)}</button>`).join('')}
    </div>`;
  const item = m => { const t = tagById(m.tag); return `<button class="item" data-mo="${m.id}">
      <span class="cat-ico" style="background:var(--surface-2);font-size:20px">${t.emoji}</span>
      <div class="main"><div class="title wrap">${esc(m.text)}</div><div class="meta">${m.wish ? esc(t.name) : `${niceDate(m.date)} · ${esc(t.name)}`} ${starsHtml(m.rating)}</div></div>
    </button>`; };

  if (seg === 'dnevnik') {
    const nowP = todayStr().slice(0, 7);
    const monthList = done.filter(m => m.date.startsWith(nowP));
    const counts = tags.map(t => ({ t, n: monthList.filter(m => m.tag === t.id).length })).filter(x => x.n);
    const best = monthList.filter(m => m.rating).sort((a, b) => b.rating - a.rating)[0];
    const list = done.filter(m => !ui.momTag || m.tag === ui.momTag).sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
    let html = '', lastM = '';
    for (const m of list) {
      const mk = m.date.slice(0, 7);
      if (mk !== lastM) { if (lastM) html += '</div>'; const d = parseYmd(m.date); html += `<div class="sec-head"><span class="section-title">${MONTHS[d.getMonth()]} ${d.getFullYear()}</span></div><div class="card tight">`; lastM = mk; }
      html += item(m);
    }
    if (lastM) html += '</div>';
    view.innerHTML = `${segHtml}
      <div class="card arch-hero" style="background-image:url('${PHOTO.window}')">
        <div class="kicker" style="opacity:.75">The archive / ${MONTHS[now.getMonth()]}</div>
        <h3>${MONTHS[now.getMonth()]} u brojkama</h3>
        <div class="hand">${monthList.length ? `${monthList.length} ${plural(monthList.length, 'trenutak', 'trenutka', 'trenutaka')}` : 'još ništa ovaj mjesec'}</div>
        ${counts.length ? `<div class="hero-pills">${counts.map(x => `<span>${x.t.emoji} ${x.n}</span>`).join('')}</div>` : ''}
        ${best ? `<div style="margin-top:10px;font-size:14px;opacity:.9">Najbolje ocijenjeno: <b>${esc(best.text)}</b> ${'★'.repeat(best.rating)}</div>` : ''}
      </div>
      ${done.length ? tagFilter(done) : ''}
      ${list.length ? html : `<div class="card">${emptyArt('moment', 'prvi trenutak?', 'Pročitana knjiga, dobar film, dejt, večera s curama… zapiši na +')}</div>`}
    `;
  } else {
    const groups = tags.map(t => ({ t, list: wishes.filter(m => m.tag === t.id) })).filter(g => g.list.length);
    view.innerHTML = `${segHtml}
      <div class="note" style="margin:0 4px 6px">Knjige koje želiš pročitati, filmovi za pogledati, mjesta za probati… Kad obaviš, označi kao gotovo i pojavi se u dnevniku.</div>
      ${groups.length ? groups.map(g => `<div class="sec-head"><span class="section-title">${g.t.emoji} ${esc(g.t.name)}</span></div><div class="card tight">${g.list.map(item).join('')}</div>`).join('')
        : `<div class="card">${emptyArt('books', 'lista želja je prazna', 'Dodaj na +')}</div>`}
    `;
  }
  document.getElementById('mseg').onclick = ev => { const b = ev.target.closest('[data-s]'); if (b) { ui.momSeg = b.dataset.s; ui.momTag = ''; render(); } };
  view.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { ui.momTag = b.dataset.tag; render(); });
  view.querySelectorAll('[data-mo]').forEach(b => b.onclick = () => { const m = state.moments.find(x => x.id === b.dataset.mo); if (m) openMomentSheet(m); });
}

function openMomentSheet(existing, asWish) {
  const wish = existing ? !!existing.wish : !!asWish;
  const m = existing || { tag: state.momentTags[0].id, text: '', date: todayStr(), rating: 0 };
  let tag = m.tag, rating = m.rating || 0;
  const tagChips = () => state.momentTags.map(t => `<button class="chip ${t.id === tag ? 'on' : ''}" data-id="${t.id}">${t.emoji} ${esc(t.name)}</button>`).join('') + `<button class="chip" data-new="1">+ Nova</button>`;
  openSheet(existing ? (wish ? 'Na listi želja' : 'Moment') : (wish ? 'Dodaj na listu želja' : 'Novi moment'), `
    <div class="field"><label>Što je bilo?</label><div class="chips" id="f-tag">${tagChips()}</div></div>
    <div class="field"><label>${wish ? 'Što želiš?' : 'Opis'}</label><textarea id="f-text" style="min-height:90px" placeholder="${wish ? 'npr. Atomic Habits' : 'npr. Pročitala Atomic Habits, super za navike'}">${esc(m.text)}</textarea></div>
    ${wish ? '' : `<div class="row2">
      <div class="field"><label>Datum</label><input id="f-date" type="date" value="${m.date || todayStr()}"></div>
      <div class="field"><label>Ocjena</label><div class="stars" id="f-stars">${[1,2,3,4,5].map(i => `<button data-r="${i}" class="${i <= rating ? 'on' : ''}">★</button>`).join('')}</div></div>
    </div>`}
    <button class="btn" id="f-save">Spremi</button>
    ${existing && wish ? `<button class="btn ghost" id="f-done">✓ Gotovo, prebaci u dnevnik</button>` : ''}
    ${existing ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  const tagEl = document.getElementById('f-tag');
  tagEl.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.new) {
      const name = (prompt('Naziv nove oznake (npr. Koncert):') || '').trim(); if (!name) return;
      const emoji = (prompt('Emoji za oznaku:', '🎵') || '✨').trim() || '✨';
      const t = { id: uid(), emoji, name }; state.momentTags.splice(state.momentTags.length - 1, 0, t); save();
      tag = t.id; tagEl.innerHTML = tagChips(); return;
    }
    tag = b.dataset.id; tagEl.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  };
  const st = document.getElementById('f-stars');
  if (st) st.onclick = ev => {
    const b = ev.target.closest('[data-r]'); if (!b) return;
    const r = +b.dataset.r; rating = rating === r ? 0 : r;
    st.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.r <= rating));
  };
  if (!existing) setTimeout(() => document.getElementById('f-text').focus(), 280);
  document.getElementById('f-save').onclick = () => {
    const text = document.getElementById('f-text').value.trim(); if (!text) return toast('Upiši nešto');
    const data = wish ? { tag, text } : { tag, text, date: document.getElementById('f-date').value || todayStr(), rating };
    if (existing) Object.assign(existing, data);
    else state.moments.push({ id: uid(), created: Date.now(), wish, ...data });
    save(); closeSheet(); render(); toast(wish ? 'Dodano na listu ✦' : 'Moment spremljen ✦');
  };
  if (existing && wish) document.getElementById('f-done').onclick = () => {
    existing.text = document.getElementById('f-text').value.trim() || existing.text;
    existing.tag = tag; existing.wish = false; existing.date = todayStr(); existing.created = Date.now();
    save(); closeSheet(); ui.momSeg = 'dnevnik'; render(); openMomentSheet(existing); toast('Bravo! Dodaj ocjenu ✦');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati?')) return;
    state.moments = state.moments.filter(x => x.id !== existing.id); save(); closeSheet(); render();
  };
}

/* ===================== PROJEKTI ===================== */
function projectCard(p) {
  const todos = p.todos || [], ideas = p.ideas || [];
  const doneT = todos.filter(t => t.done).length;
  const meta = [ideas.length ? `💡 ${ideas.length}` : null, todos.length ? `✓ ${doneT}/${todos.length}` : null, p.updated ? `ažurirano ${shortDate(ymd(new Date(p.updated)))}` : null].filter(Boolean).join('  ·  ');
  return `<button class="pcard" data-pid="${p.id}">
    <span class="emoji" style="background:${hexA(p.color,.12)};box-shadow:inset 0 0 0 1px ${hexA(p.color,.5)}">${esc(p.emoji || '✨')}</span>
    <div style="flex:1;min-width:0">
      <div class="nm">${esc(p.name)}</div>
      <div class="st">${p.status ? esc(p.status) : '<span style="color:var(--muted)">Još nisi zapisala na čemu si.</span>'}</div>
      ${meta ? `<div class="mt">${meta}</div>` : ''}

function ideaRow(i) {
  return `<button class="item" data-idea="${i.id}">

    <div class="main"><div class="title wrap">${esc(i.text)}</div><div class="meta">${shortDate(i.date)}</div></div>
  </button>`;

function touch(p) { p.updated = Date.now(); }

function renderProject() {
  const p = projectById(ui.project);
  if (!p) { ui.project = null; return render(); }
  p.notes ||= []; p.ideas ||= []; p.todos ||= [];
  setHeader(`${p.emoji || '✨'} ${p.name}`, p.archived ? 'Arhivirani projekt' : 'Projekt', { back: true, btn: { ico: 'pencil', label: 'Uredi projekt', onclick: () => openProjectSheet(p) } });

  const seg = ui.projSeg;
  let body = '';
  if (seg === 'dnevnik') {
    const notes = p.notes.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
    body = notes.length ? `<div class="card tight">${notes.map(n => `<button class="log" data-note="${n.id}"><div class="d">${niceDate(n.date)}</div><div class="t">${esc(n.text)}</div></button>`).join('')}</div>`
      : `<div class="card">${emptyArt('walk', 'dnevnik je prazan', 'Ovdje zapisuj što si napravila. Na + dodaješ zapis.')}</div>`;
  } else if (seg === 'ideje') {
    body = p.ideas.length ? `<div class="card tight">${p.ideas.slice().reverse().map(i => ideaRow(i)).join('')}</div>`
      : `<div class="card">${emptyArt('bulb', 'sve ideje ovdje', 'Čak i one napola gotove.')}</div>`;
  } else {
    const todos = p.todos.slice().sort((a, b) => (a.done - b.done) || (a.created || 0) - (b.created || 0));
    body = todos.length ? `<div class="card tight">${todos.map(t => `<div class="item ${t.done ? 'done' : ''}" data-todo="${t.id}">
        <span class="check ${t.done ? 'on' : ''}">${t.done ? icon('check', 14, 3) : ''}</span>
        <div class="main"><div class="title wrap">${esc(t.text)}</div></div></div>`).join('')}</div>`
      : `<div class="card">${emptyArt('plant', 'nema zadataka', 'Dodaj ih na +')}</div>`;
  }

  view.innerHTML = `
    <button class="card status-card" id="status" style="border-left:4px solid ${p.color}">
      <div class="kicker" style="color:${p.color}">Na čemu sam</div>
      <div class="txt ${p.status ? '' : 'ph'}">${p.status ? esc(p.status) : 'Dodirni i zapiši gdje si stala i što je sljedeći korak…'}</div>
      ${p.updated ? `<div class="note" style="margin:8px 0 0">Ažurirano ${niceDate(ymd(new Date(p.updated))).toLowerCase()}</div>` : ''}
    </button>
    <div class="seg" id="pseg">
      <button data-s="dnevnik" class="${seg === 'dnevnik' ? 'on' : ''}">Dnevnik</button>
      <button data-s="ideje" class="${seg === 'ideje' ? 'on' : ''}">Ideje${p.ideas.length ? ` (${p.ideas.length})` : ''}</button>
      <button data-s="zadaci" class="${seg === 'zadaci' ? 'on' : ''}">Zadaci${p.todos.length ? ` (${p.todos.filter(t => !t.done).length})` : ''}</button>
    </div>
    ${body}
  `;

  document.getElementById('status').onclick = () => openTextSheet('Na čemu sam', p.status || '', 'Gdje si stala, što radiš sad, što je sljedeće…', v => { p.status = v; touch(p); });
  document.getElementById('pseg').onclick = ev => { const b = ev.target.closest('[data-s]'); if (b) { ui.projSeg = b.dataset.s; render(); } };
  view.querySelectorAll('[data-note]').forEach(b => b.onclick = () => {
    const n = p.notes.find(x => x.id === b.dataset.note); if (!n) return;
    openNoteSheet(p, n);
  });
  view.querySelectorAll('[data-idea]').forEach(b => b.onclick = () => { const i = p.ideas.find(x => x.id === b.dataset.idea); if (i) openIdeaSheet(i, p.id); });
  view.querySelectorAll('[data-todo]').forEach(el => el.onclick = ev => {
    const t = p.todos.find(x => x.id === el.dataset.todo); if (!t) return;
    if (ev.target.closest('.check')) { t.done = !t.done; touch(p); save(); render(); }
    else openTextSheet('Uredi zadatak', t.text, '', v => { t.text = v; touch(p); }, () => { p.todos = p.todos.filter(x => x.id !== t.id); touch(p); }, true);
  });
}

function openProjectSheet(existing) {
  let color = existing ? existing.color : PALETTE[(state.projects.length + 1) % PALETTE.length];
  openSheet(existing ? 'Uredi projekt' : 'Novi projekt', `
    <div class="row2" style="grid-template-columns:80px 1fr">
      <div class="field"><label>Emoji</label><input id="f-emoji" value="${esc(existing ? existing.emoji : '✨')}" style="text-align:center;font-size:22px" autocomplete="off"></div>
      <div class="field"><label>Naziv</label><input id="f-name" value="${esc(existing ? existing.name : '')}" placeholder="npr. Out There" autocomplete="off"></div>
    </div>
    <div class="field"><label>Boja</label>${swatches(color)}</div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn ghost" id="f-arch">${existing.archived ? 'Vrati iz arhive' : 'Arhiviraj'}</button><button class="btn danger" id="f-del">Obriši projekt</button>` : ''}
  `);
  bindSwatches(c => color = c);
  if (!existing) setTimeout(() => document.getElementById('f-name').focus(), 280);
  document.getElementById('f-save').onclick = () => {
    const name = document.getElementById('f-name').value.trim(); if (!name) return toast('Upiši naziv');
    const emoji = document.getElementById('f-emoji').value.trim() || '✨';
    if (existing) { Object.assign(existing, { name, emoji, color }); }
    else { const p = { id: uid(), name, emoji, color, status: '', notes: [], ideas: [], todos: [], updated: Date.now() }; state.projects.push(p); ui.project = p.id; ui.projSeg = 'dnevnik'; }
    save(); closeSheet(); render(); toast('Spremljeno');
  };
  if (existing) {
    document.getElementById('f-arch').onclick = () => { existing.archived = !existing.archived; save(); closeSheet(); render(); };
    document.getElementById('f-del').onclick = () => {
      if (!confirm(`Obrisati projekt "${existing.name}" sa svim zapisima, idejama i zadacima?`)) return;
      state.projects = state.projects.filter(x => x.id !== existing.id); ui.project = null; save(); closeSheet(); render(); toast('Obrisano');
    };
  }
}

function openNoteSheet(p, existing) {
  openSheet(existing ? 'Uredi zapis' : 'Novi zapis', `
    <div class="field"><label>Datum</label><input id="f-date" type="date" value="${existing ? existing.date : todayStr()}"></div>
    <div class="field"><label>Što sam napravila</label><textarea id="f-text" placeholder="npr. Složila wireframe za passport ekran, javila se dizajnerici…">${esc(existing ? existing.text : '')}</textarea></div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  if (!existing) setTimeout(() => document.getElementById('f-text').focus(), 280);
  document.getElementById('f-save').onclick = () => {
    const text = document.getElementById('f-text').value.trim(); if (!text) return toast('Upiši tekst');
    const date = document.getElementById('f-date').value || todayStr();
    if (existing) Object.assign(existing, { text, date }); else p.notes.push({ id: uid(), date, text, created: Date.now() });
    touch(p); save(); closeSheet(); render(); toast('Spremljeno');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati ovaj zapis?')) return;
    p.notes = p.notes.filter(x => x.id !== existing.id); save(); closeSheet(); render();
  };
}

function openIdeaSheet(existing, fromProjectId) {
  const curProj = existing ? (fromProjectId || '') : (ui.tab === 'projekti' && ui.project ? ui.project : '');
  let target = curProj;
  const opts = [{ id: '', name: 'Bez projekta', emoji: '📥' }, ...state.projects.filter(p => !p.archived)];
  openSheet(existing ? 'Ideja' : 'Nova ideja', `
    <div class="field"><label>Ideja</label><textarea id="f-text" placeholder="Zapiši dok ne pobjegne…">${esc(existing ? existing.text : '')}</textarea></div>
    <div class="field"><label>Projekt</label><div class="chips" id="f-proj">${opts.map(p => `<button class="chip ${p.id === target ? 'on' : ''}" data-id="${p.id}">${esc(p.emoji || '✨')} ${esc(p.name)}</button>`).join('')}</div></div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  document.getElementById('f-proj').onclick = ev => {
    const b = ev.target.closest('[data-id]'); if (!b) return;
    target = b.dataset.id; document.querySelectorAll('#f-proj .chip').forEach(x => x.classList.toggle('on', x === b));
  };
  if (!existing) setTimeout(() => document.getElementById('f-text').focus(), 280);
  const listOf = id => id ? projectById(id).ideas ||= [] : state.inbox;
  const removeFrom = (id, idea) => { if (id) { const p = projectById(id); p.ideas = p.ideas.filter(x => x.id !== idea.id); } else state.inbox = state.inbox.filter(x => x.id !== idea.id); };
  document.getElementById('f-save').onclick = () => {
    const text = document.getElementById('f-text').value.trim(); if (!text) return toast('Upiši ideju');
    if (existing) {
      existing.text = text;
      if (target !== curProj) { removeFrom(curProj, existing); listOf(target).push(existing); }
    } else listOf(target).push({ id: uid(), text, date: todayStr() });
    if (target) touch(projectById(target));
    save(); closeSheet(); render(); toast('Ideja spremljena 💡');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati ovu ideju?')) return;
    removeFrom(curProj, existing); save(); closeSheet(); render();
  };
}

function openTextSheet(title, value, placeholder, onSave, onDelete, small) {
  openSheet(title, `
    <div class="field"><textarea id="f-text" placeholder="${esc(placeholder)}" style="${small ? 'min-height:80px' : 'min-height:160px'}">${esc(value)}</textarea></div>
    <button class="btn" id="f-save">Spremi</button>
    ${onDelete ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  setTimeout(() => { const t = document.getElementById('f-text'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }, 280);
  document.getElementById('f-save').onclick = () => { const v = document.getElementById('f-text').value.trim(); if (small && !v) return toast('Upiši tekst'); onSave(v); save(); closeSheet(); render(); toast('Spremljeno'); };
  if (onDelete) document.getElementById('f-del').onclick = () => { onDelete(); save(); closeSheet(); render(); };
}

function swatches(cur) { return `<div class="swatches" id="f-color">${PALETTE.map(c => `<button class="${c === cur ? 'on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div>`; }
function bindSwatches(cb) {
  document.getElementById('f-color').onclick = ev => {
    const b = ev.target.closest('[data-c]'); if (!b) return;
    cb(b.dataset.c); document.querySelectorAll('#f-color button').forEach(x => x.classList.toggle('on', x === b));
  };
}

async function exportBackup() {
  const json = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
  const name = `iva-edit-backup-${todayStr()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'The Iva Edit. backup' }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importBackup(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.events) || !Array.isArray(d.tx)) throw new Error('format');
      if (!confirm('Uvesti backup? Trenutni podaci bit će zamijenjeni.')) return;
      delete d.exportedAt; state = normalize(d); save(); render(); toast('Backup uvezen');
    } catch (e) { toast('Neispravna datoteka'); }
    ev.target.value = '';
  };
  r.readAsText(f);
}
