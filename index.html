<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Planer</title>
<style>
  :root {
    --bg: #0e1014;
    --surface: #171a21;
    --surface-2: #1f232c;
    --line: #2a2f3a;
    --text: #eef0f4;
    --muted: #8b93a5;
    --accent: #8ea2ff;
    --accent-soft: rgba(142,162,255,.15);
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.4;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, select, textarea { font: inherit; font-size: 16px; color: var(--text); }

  header.top {
    position: sticky; top: 0; z-index: 5;
    padding: calc(var(--safe-top) + 12px) 20px 10px;
    background: linear-gradient(var(--bg) 80%, rgba(14,16,20,0));
  }
  header.top h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  header.top .sub { color: var(--muted); font-size: 13px; }

  main { padding: 0 16px calc(var(--safe-bottom) + 110px); max-width: 560px; margin: 0 auto; }

  .card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; font-weight: 600; }

  /* Month nav */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .month-nav .label { font-weight: 650; font-size: 17px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 18px; }
  .pill-btn { padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }

  /* Calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal .wd { font-size: 11px; color: var(--muted); padding: 4px 0 6px; font-weight: 600; }
  .cal .day { aspect-ratio: 1 / 1.05; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 15px; position: relative; }
  .cal .day.other { color: #4a5160; }
  .cal .day.today .n { color: var(--accent); font-weight: 700; }
  .cal .day.sel { background: var(--accent); color: #0e1014; }
  .cal .day.sel .n { color: #0e1014; font-weight: 700; }
  .dots { display: flex; gap: 3px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
  .cal .day.sel .dots i { background: #0e1014 !important; }

  /* Lists */
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .title { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item.done .title { text-decoration: line-through; color: var(--muted); }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 13px; }
  .check.on { border-color: var(--accent); background: var(--accent); color: #0e1014; }
  .bar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 14px; }
  .amount { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amount.in { color: var(--green); }
  .cat-ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-size: 18px; background: var(--surface-2); flex: none; }
  .date-head { font-size: 12px; color: var(--muted); padding: 10px 4px 0; font-weight: 600; }

  /* Budget summary */
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .summary .big { grid-column: 1 / -1; }
  .stat .k { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat.big .v { font-size: 32px; letter-spacing: -.02em; }
  .progress { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .progress > span { display: block; height: 100%; border-radius: 8px; background: var(--accent); }
  .progress > span.over { background: var(--red); }
  .cat-row { padding: 10px 2px; }
  .cat-row .line { display: flex; justify-content: space-between; gap: 10px; }
  .cat-row .line .r { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* Tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: space-around;
    padding: 8px 10px calc(var(--safe-bottom) + 8px);
    background: rgba(18,20,26,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 0; }
  nav.tabs button .ic { line-height: 0; }
  nav.tabs button.on { color: var(--accent); }

  .fab {
    position: fixed; right: 20px; bottom: calc(var(--safe-bottom) + 78px); z-index: 11;
    width: 56px; height: 56px; border-radius: 18px; background: var(--accent); color: #0e1014;
    font-size: 30px; font-weight: 400; display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(142,162,255,.35);
  }

  /* Sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--surface); border-radius: 22px 22px 0 0;
    padding: 10px 18px calc(var(--safe-bottom) + 18px);
    max-height: 92vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .25s ease;
    max-width: 560px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 12px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sheet-head h2 { margin: 0; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 5px 2px; text-transform: uppercase; letter-spacing: .05em; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { padding: 9px; border-radius: 10px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--bg); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .btn { width: 100%; padding: 14px; border-radius: 14px; background: var(--accent); color: #0e1014; font-weight: 700; font-size: 16px; margin-top: 6px; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: transparent; color: var(--red); }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 2px; }
  .settings-row input { width: 120px; padding: 9px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; text-align: right; }
  .note { color: var(--muted); font-size: 13px; margin: 6px 4px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 150px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <div class="sub" id="subtitle"></div>
  <h1 id="title">Planer</h1>
</header>

<main id="view"></main>

<button class="fab" id="fab" aria-label="Dodaj">+</button>

<nav class="tabs">
  <button data-tab="planer" class="on"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Planer</button>
  <button data-tab="budzet"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></span>Budžet</button>
  <button data-tab="postavke"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Postavke</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== Podaci ===================== */
const STORAGE_KEY = 'planer-data-v1';

const EVENT_CATS = [
  { id: 'posao',  name: 'Posao',  color: '#fbbf24' },
  { id: 'faks',   name: 'Faks',   color: '#60a5fa' },
  { id: 'osobno', name: 'Osobno', color: '#c084fc' },
  { id: 'ostalo', name: 'Ostalo', color: '#94a3b8' },
];

const EXPENSE_CATS = [
  { id: 'stan',      name: 'Stan i režije', ico: '🏠' },
  { id: 'hrana',     name: 'Hrana',         ico: '🛒' },
  { id: 'prijevoz',  name: 'Prijevoz',      ico: '🚗' },
  { id: 'faks',      name: 'Faks',          ico: '🎓' },
  { id: 'izlasci',   name: 'Izlasci',       ico: '🍸' },
  { id: 'kupovina',  name: 'Kupovina',      ico: '🛍️' },
  { id: 'pretplate', name: 'Pretplate',     ico: '🔁' },
  { id: 'ostalo',    name: 'Ostalo',        ico: '📦' },
];
const INCOME_CATS = [
  { id: 'placa',     name: 'Plaća',     ico: '💼' },
  { id: 'freelance', name: 'Freelance', ico: '💻' },
  { id: 'ostalo-in', name: 'Ostalo',    ico: '✨' },
];

function emptyState() { return { version: 1, events: [], tx: [], budgets: {} }; }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyState();
    const d = JSON.parse(raw);
    return Object.assign(emptyState(), d);
  } catch (e) { return emptyState(); }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { toast('Spremanje nije uspjelo'); }
}
let state = load();

/* ===================== Pomoćne ===================== */
const MONTHS = ['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];
const MONTHS_GEN = ['siječnja','veljače','ožujka','travnja','svibnja','lipnja','srpnja','kolovoza','rujna','listopada','studenoga','prosinca'];
const DAYS = ['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'];
const WD_SHORT = ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'];

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = new Intl.NumberFormat('hr-HR', { style: 'currency', currency: 'EUR' });
const money = n => eur.format(n || 0);
const parseAmount = s => { const n = parseFloat(String(s).replace(/\s/g,'').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
function niceDate(s) {
  const d = parseYmd(s);
  const t = todayStr();
  const tm = new Date(); tm.setDate(tm.getDate() + 1);
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  const base = `${d.getDate()}. ${MONTHS_GEN[d.getMonth()]}`;
  if (s === t) return `Danas, ${base}`;
  if (s === ymd(tm)) return `Sutra, ${base}`;
  if (s === ymd(yd)) return `Jučer, ${base}`;
  const day = DAYS[d.getDay()];
  return `${day[0].toUpperCase() + day.slice(1)}, ${base}`;
}
const evCat = id => EVENT_CATS.find(c => c.id === id) || EVENT_CATS[3];
const txCat = id => [...EXPENSE_CATS, ...INCOME_CATS].find(c => c.id === id) || EXPENSE_CATS[7];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ===================== UI stanje ===================== */
const now = new Date();
const ui = {
  tab: 'planer',
  calY: now.getFullYear(), calM: now.getMonth(),
  sel: todayStr(),
  budY: now.getFullYear(), budM: now.getMonth(),
};

const view = document.getElementById('view');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('subtitle');
const fab = document.getElementById('fab');

function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  fab.style.display = ui.tab === 'postavke' ? 'none' : 'grid';
  if (ui.tab === 'planer') renderPlanner();
  else if (ui.tab === 'budzet') renderBudget();
  else renderSettings();
}

/* ===================== PLANER ===================== */
function renderPlanner() {
  titleEl.textContent = 'Planer';
  subEl.textContent = niceDate(todayStr());

  const { calY: y, calM: m } = ui;
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7; // ponedjeljak = 0
  const start = new Date(y, m, 1 - offset);
  const today = todayStr();

  const byDate = {};
  for (const e of state.events) (byDate[e.date] ||= []).push(e);

  let cells = WD_SHORT.map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i === 35 && d.getMonth() !== m) break; // ne prikazuj prazan 6. red
    const s = ymd(d);
    const evs = byDate[s] || [];
    const dots = [...new Set(evs.map(e => evCat(e.cat).color))].slice(0, 3)
      .map(c => `<i style="background:${c}"></i>`).join('');
    const cls = ['day', d.getMonth() !== m && 'other', s === today && 'today', s === ui.sel && 'sel'].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-date="${s}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }

  const dayEvents = (byDate[ui.sel] || []).slice().sort(sortEvents);

  // nadolazeće (sljedećih 7 dana, bez odabranog dana)
  const limit = new Date(); limit.setDate(limit.getDate() + 7);
  const upcoming = state.events
    .filter(e => e.date >= today && e.date <= ymd(limit) && e.date !== ui.sel && !e.done)
    .sort((a, b) => a.date.localeCompare(b.date) || sortEvents(a, b))
    .slice(0, 8);

  view.innerHTML = `
    <div class="card">
      <div class="month-nav">
        <button class="icon-btn" id="prevM" aria-label="Prethodni mjesec">‹</button>
        <div class="label">${MONTHS[m]} ${y}</div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="pill-btn" id="goToday">Danas</button>
          <button class="icon-btn" id="nextM" aria-label="Sljedeći mjesec">›</button>
        </div>
      </div>
      <div class="cal" id="cal">${cells}</div>
    </div>

    <div class="section-title">${niceDate(ui.sel)}</div>
    <div class="card" style="padding:4px 12px">
      ${dayEvents.length ? dayEvents.map(e => eventRow(e)).join('') : `<div class="empty">Nema obaveza za ovaj dan.<br>Dodaj ih na +</div>`}
    </div>

    ${upcoming.length ? `
      <div class="section-title">Idućih 7 dana</div>
      <div class="card" style="padding:4px 12px">
        ${upcoming.map(e => eventRow(e, true)).join('')}
      </div>` : ''}
  `;

  document.getElementById('prevM').onclick = () => shiftCal(-1);
  document.getElementById('nextM').onclick = () => shiftCal(1);
  document.getElementById('goToday').onclick = () => {
    const n = new Date(); ui.calY = n.getFullYear(); ui.calM = n.getMonth(); ui.sel = todayStr(); render();
  };
  document.getElementById('cal').onclick = ev => {
    const b = ev.target.closest('[data-date]'); if (!b) return;
    ui.sel = b.dataset.date;
    const d = parseYmd(ui.sel); ui.calY = d.getFullYear(); ui.calM = d.getMonth();
    render();
  };
  view.querySelectorAll('[data-ev]').forEach(el => {
    el.onclick = ev => {
      const e = state.events.find(x => x.id === el.dataset.ev); if (!e) return;
      if (ev.target.closest('.check')) { e.done = !e.done; save(); render(); }
      else openEventSheet(e);
    };
  });
}
function sortEvents(a, b) {
  if (!!a.done !== !!b.done) return a.done ? 1 : -1;
  return (a.time || '99:99').localeCompare(b.time || '99:99');
}
function eventRow(e, showDate) {
  const c = evCat(e.cat);
  const meta = [showDate ? niceDate(e.date) : null, e.time || 'Cijeli dan', c.name].filter(Boolean).join(' · ');
  return `<div class="item ${e.done ? 'done' : ''}" data-ev="${e.id}">
    <span class="check ${e.done ? 'on' : ''}">${e.done ? '✓' : ''}</span>
    <span class="bar" style="background:${c.color}"></span>
    <div class="main"><div class="title">${esc(e.title)}</div><div class="meta">${esc(meta)}${e.note ? ' · ' + esc(e.note) : ''}</div></div>
  </div>`;
}
function shiftCal(d) {
  ui.calM += d;
  if (ui.calM < 0) { ui.calM = 11; ui.calY--; }
  if (ui.calM > 11) { ui.calM = 0; ui.calY++; }
  render();
}

function openEventSheet(existing) {
  const e = existing || { id: null, date: ui.sel, time: '', title: '', cat: 'osobno', note: '', done: false };
  let cat = e.cat;
  openSheet(existing ? 'Uredi obavezu' : 'Nova obaveza', `
    <div class="field"><label>Naziv</label><input id="f-title" value="${esc(e.title)}" placeholder="npr. Ispit iz ASP-a" autocomplete="off"></div>
    <div class="row2">
      <div class="field"><label>Datum</label><input id="f-date" type="date" value="${e.date}"></div>
      <div class="field"><label>Vrijeme</label><input id="f-time" type="time" value="${e.time || ''}"></div>
    </div>
    <div class="field"><label>Kategorija</label>
      <div class="chips" id="f-cat">${EVENT_CATS.map(c => `<button class="chip ${c.id === cat ? 'on' : ''}" data-id="${c.id}"><span style="color:${c.color}">●</span> ${c.name}</button>`).join('')}</div>
    </div>
    <div class="field"><label>Bilješka</label><input id="f-note" value="${esc(e.note)}" placeholder="neobavezno" autocomplete="off"></div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  document.getElementById('f-cat').onclick = ev => {
    const b = ev.target.closest('[data-id]'); if (!b) return;
    cat = b.dataset.id;
    document.querySelectorAll('#f-cat .chip').forEach(x => x.classList.toggle('on', x === b));
  };
  if (!existing) setTimeout(() => document.getElementById('f-title').focus(), 250);
  document.getElementById('f-save').onclick = () => {
    const title = document.getElementById('f-title').value.trim();
    const date = document.getElementById('f-date').value;
    if (!title) return toast('Upiši naziv');
    if (!date) return toast('Odaberi datum');
    const data = { title, date, time: document.getElementById('f-time').value, cat, note: document.getElementById('f-note').value.trim() };
    if (existing) Object.assign(existing, data);
    else state.events.push({ id: uid(), done: false, ...data });
    save(); closeSheet();
    ui.sel = date; const d = parseYmd(date); ui.calY = d.getFullYear(); ui.calM = d.getMonth();
    render(); toast('Spremljeno');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati ovu obavezu?')) return;
    state.events = state.events.filter(x => x.id !== existing.id);
    save(); closeSheet(); render(); toast('Obrisano');
  };
}

/* ===================== BUDŽET ===================== */
function renderBudget() {
  const { budY: y, budM: m } = ui;
  const prefix = `${y}-${pad(m+1)}`;
  titleEl.textContent = 'Budžet';
  subEl.textContent = `${MONTHS[m]} ${y}`;

  const txs = state.tx.filter(t => t.date.startsWith(prefix));
  const income = txs.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
  const spent = txs.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
  const left = income - spent;

  const byCat = {};
  for (const t of txs) if (t.type === 'out') byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
  const catRows = EXPENSE_CATS
    .filter(c => byCat[c.id] || state.budgets[c.id])
    .map(c => {
      const s = byCat[c.id] || 0, lim = state.budgets[c.id] || 0;
      const pct = lim ? Math.min(100, s / lim * 100) : 0;
      const right = lim ? `${money(s)} / ${money(lim)}` : money(s);
      return `<div class="cat-row">
        <div class="line"><span>${c.ico} ${c.name}</span><span class="r">${right}</span></div>
        ${lim ? `<div class="progress"><span class="${s > lim ? 'over' : ''}" style="width:${pct}%"></span></div>` : ''}
        ${lim && s > lim ? `<div class="note" style="color:var(--red);margin:4px 0 0">Prekoračeno za ${money(s - lim)}</div>` : ''}
      </div>`;
    }).join('');

  const totalLimit = Object.values(state.budgets).reduce((s, v) => s + (v || 0), 0);

  // grupiranje po datumu
  const sorted = txs.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
  let list = '', lastDate = '';
  for (const t of sorted) {
    if (t.date !== lastDate) { list += `<div class="date-head">${niceDate(t.date)}</div>`; lastDate = t.date; }
    const c = txCat(t.cat);
    list += `<div class="item" data-tx="${t.id}">
      <span class="cat-ico">${c.ico}</span>
      <div class="main"><div class="title">${esc(t.note || c.name)}</div><div class="meta">${esc(c.name)}</div></div>
      <span class="amount ${t.type === 'in' ? 'in' : ''}">${t.type === 'in' ? '+' : '−'}${money(t.amount)}</span>
    </div>`;
  }

  view.innerHTML = `
    <div class="month-nav" style="padding:0 2px">
      <button class="icon-btn" id="prevB">‹</button>
      <div class="label">${MONTHS[m]} ${y}</div>
      <button class="icon-btn" id="nextB">›</button>
    </div>

    <div class="card summary">
      <div class="stat big"><div class="k">Ostaje ovaj mjesec</div><div class="v" style="color:${left < 0 ? 'var(--red)' : 'var(--text)'}">${money(left)}</div></div>
      <div class="stat"><div class="k">Prihodi</div><div class="v" style="color:var(--green)">${money(income)}</div></div>
      <div class="stat"><div class="k">Troškovi</div><div class="v">${money(spent)}</div></div>
      ${totalLimit ? `<div class="stat big" style="margin-top:4px">
          <div class="k">Potrošeno od plana · ${money(spent)} / ${money(totalLimit)}</div>
          <div class="progress"><span class="${spent > totalLimit ? 'over' : ''}" style="width:${Math.min(100, spent / totalLimit * 100)}%"></span></div>
        </div>` : ''}
    </div>

    <div class="section-title">Po kategorijama</div>
    <div class="card">
      ${catRows || `<div class="empty">Još nema troškova ovaj mjesec.</div>`}
      ${totalLimit ? '' : `<div class="note">Mjesečne limite po kategorijama postavljaš u Postavkama.</div>`}
    </div>

    <div class="section-title">Transakcije</div>
    <div class="card" style="padding:0 12px 4px">
      ${list || `<div class="empty">Dodaj prvi trošak ili prihod na +</div>`}
    </div>
  `;

  document.getElementById('prevB').onclick = () => shiftBud(-1);
  document.getElementById('nextB').onclick = () => shiftBud(1);
  view.querySelectorAll('[data-tx]').forEach(el => {
    el.onclick = () => { const t = state.tx.find(x => x.id === el.dataset.tx); if (t) openTxSheet(t); };
  });
}
function shiftBud(d) {
  ui.budM += d;
  if (ui.budM < 0) { ui.budM = 11; ui.budY--; }
  if (ui.budM > 11) { ui.budM = 0; ui.budY++; }
  render();
}

function openTxSheet(existing) {
  const curMonth = `${ui.budY}-${pad(ui.budM+1)}`;
  const defDate = todayStr().startsWith(curMonth) ? todayStr() : `${curMonth}-01`;
  const t = existing || { id: null, type: 'out', amount: '', cat: 'hrana', date: defDate, note: '' };
  let type = t.type, cat = t.cat;

  const catChips = () => (type === 'in' ? INCOME_CATS : EXPENSE_CATS)
    .map(c => `<button class="chip ${c.id === cat ? 'on' : ''}" data-id="${c.id}">${c.ico} ${c.name}</button>`).join('');

  openSheet(existing ? 'Uredi transakciju' : 'Nova transakcija', `
    <div class="seg" id="f-type">
      <button data-t="out" class="${type === 'out' ? 'on' : ''}">Trošak</button>
      <button data-t="in" class="${type === 'in' ? 'on' : ''}">Prihod</button>
    </div>
    <div class="field"><label>Iznos (€)</label><input id="f-amount" inputmode="decimal" value="${t.amount === '' ? '' : String(t.amount).replace('.', ',')}" placeholder="0,00" autocomplete="off" style="font-size:24px;font-weight:700"></div>
    <div class="field"><label>Kategorija</label><div class="chips" id="f-cat">${catChips()}</div></div>
    <div class="row2">
      <div class="field"><label>Datum</label><input id="f-date" type="date" value="${t.date}"></div>
      <div class="field"><label>Opis</label><input id="f-note" value="${esc(t.note)}" placeholder="npr. Konzum" autocomplete="off"></div>
    </div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);

  document.getElementById('f-type').onclick = ev => {
    const b = ev.target.closest('[data-t]'); if (!b || b.dataset.t === type) return;
    type = b.dataset.t;
    cat = type === 'in' ? 'placa' : 'hrana';
    document.querySelectorAll('#f-type button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('f-cat').innerHTML = catChips();
  };
  document.getElementById('f-cat').onclick = ev => {
    const b = ev.target.closest('[data-id]'); if (!b) return;
    cat = b.dataset.id;
    document.querySelectorAll('#f-cat .chip').forEach(x => x.classList.toggle('on', x === b));
  };
  if (!existing) setTimeout(() => document.getElementById('f-amount').focus(), 250);
  document.getElementById('f-save').onclick = () => {
    const amount = parseAmount(document.getElementById('f-amount').value);
    const date = document.getElementById('f-date').value;
    if (!(amount > 0)) return toast('Upiši iznos');
    if (!date) return toast('Odaberi datum');
    const data = { type, amount, cat, date, note: document.getElementById('f-note').value.trim() };
    if (existing) Object.assign(existing, data);
    else state.tx.push({ id: uid(), created: Date.now(), ...data });
    save(); closeSheet();
    const d = parseYmd(date); ui.budY = d.getFullYear(); ui.budM = d.getMonth();
    render(); toast('Spremljeno');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati ovu transakciju?')) return;
    state.tx = state.tx.filter(x => x.id !== existing.id);
    save(); closeSheet(); render(); toast('Obrisano');
  };
}

/* ===================== POSTAVKE ===================== */
function renderSettings() {
  titleEl.textContent = 'Postavke';
  subEl.textContent = `${state.events.length} obaveza · ${state.tx.length} transakcija`;

  view.innerHTML = `
    <div class="section-title">Mjesečni limiti po kategoriji</div>
    <div class="card">
      ${EXPENSE_CATS.map(c => `
        <div class="settings-row">
          <span>${c.ico} ${c.name}</span>
          <input inputmode="decimal" data-lim="${c.id}" value="${state.budgets[c.id] ? String(state.budgets[c.id]).replace('.', ',') : ''}" placeholder="bez limita">
        </div>`).join('')}
      <div class="note">Iznosi u eurima. Ostavi prazno ako ne želiš limit.</div>
    </div>

    <div class="section-title">Sigurnosna kopija</div>
    <div class="card">
      <button class="btn ghost" id="exp">⬇️ Izvezi backup</button>
      <button class="btn ghost" id="imp">⬆️ Uvezi backup</button>
      <input type="file" id="impFile" accept="application/json,.json" style="display:none">
      <div class="note">Podaci su spremljeni samo na ovom uređaju. Napravi backup svakih par tjedana i spremi ga u iCloud Drive (Datoteke).</div>
    </div>

    <div class="section-title">Opasna zona</div>
    <div class="card">
      <button class="btn danger" id="wipe" style="margin:0">Obriši sve podatke</button>
    </div>
  `;

  view.querySelectorAll('[data-lim]').forEach(inp => {
    inp.onchange = () => {
      const v = parseAmount(inp.value);
      if (v > 0) state.budgets[inp.dataset.lim] = v; else delete state.budgets[inp.dataset.lim];
      save(); toast('Limit spremljen');
    };
  });
  document.getElementById('exp').onclick = exportBackup;
  document.getElementById('imp').onclick = () => document.getElementById('impFile').click();
  document.getElementById('impFile').onchange = importBackup;
  document.getElementById('wipe').onclick = () => {
    if (!confirm('Sigurno obrisati SVE obaveze i transakcije?')) return;
    if (!confirm('Ovo se ne može vratiti. Nastaviti?')) return;
    state = emptyState(); save(); render(); toast('Sve obrisano');
  };
}

async function exportBackup() {
  const json = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
  const name = `planer-backup-${todayStr()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Planer backup' });
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importBackup(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.events) || !Array.isArray(d.tx)) throw new Error('format');
      if (!confirm(`Uvesti backup (${d.events.length} obaveza, ${d.tx.length} transakcija)? Trenutni podaci bit će zamijenjeni.`)) return;
      state = Object.assign(emptyState(), { events: d.events, tx: d.tx, budgets: d.budgets || {} });
      save(); render(); toast('Backup uvezen');
    } catch (e) { toast('Neispravna datoteka'); }
    ev.target.value = '';
  };
  r.readAsText(f);
}

/* ===================== Sheet ===================== */
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
function openSheet(title, html) {
  sheet.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2>${title}</h2><button class="icon-btn" id="sheetX" aria-label="Zatvori">✕</button></div>${html}`;
  sheet.classList.add('open'); backdrop.classList.add('open');
  document.getElementById('sheetX').onclick = closeSheet;
}
function closeSheet() {
  sheet.classList.remove('open'); backdrop.classList.remove('open');
  if (document.activeElement) document.activeElement.blur();
}
backdrop.onclick = closeSheet;

/* ===================== Navigacija ===================== */
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; window.scrollTo(0, 0); render(); });
fab.onclick = () => ui.tab === 'planer' ? openEventSheet() : openTxSheet();

render();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
