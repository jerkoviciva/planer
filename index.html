<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EBE5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Iva Edit">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<title>The Iva Edit.</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("planer-theme")==="dark"?"dark":"light"}catch(e){}</script>
<style>
  :root {
    --bg: #F1EBE5;
    --surface: #FAF7F2;
    --surface-2: #E8E1D9;
    --line: #D8CFC5;
    --ink: #151735;
    --muted: #8A8790;
    --blue: #1234D9;
    --orange: #FF6500;
    --night: #151735;
    --paper: #FAF7F2;
    --accent: #1234D9;
    --accent-soft: rgba(18,52,217,.08);
    --on-accent: #FAF7F2;
    --green: #12805c;
    --red: #d93a2b;
    --serif: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --cut: 16px;
  }
  [data-theme="dark"] {
    --bg: #0E0F26;
    --surface: #17193A;
    --surface-2: #21244D;
    --line: #2D3064;
    --ink: #F1EBE5;
    --muted: #9C9AB8;
    --accent: #5872FF;
    --accent-soft: rgba(88,114,255,.14);
    --on-accent: #FAF7F2;
    --green: #4fd39b;
    --red: #ff7468;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.4; min-height: 100vh; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
  svg { display: block; flex: none; }
  .hidden { display: none !important; }
  .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase; }
  .num { font-variant-numeric: tabular-nums; }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 5; padding: calc(var(--safe-top) + 14px) 20px 10px; background: var(--bg); }
  .hrow { display: flex; align-items: flex-end; gap: 12px; max-width: 560px; margin: 0 auto; }
  .htext { flex: 1; min-width: 0; }
  header.top .sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  header.top h1 { margin: 0; font-family: var(--serif); font-weight: 800; font-size: 38px; letter-spacing: -.02em; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top.big { padding-bottom: 4px; }
  header.top.big .sub { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 44px; letter-spacing: -.02em; text-transform: none; color: var(--ink); line-height: .95; margin: 0; }
  header.top.big h1 { font-size: 76px; font-weight: 900; line-height: .9; letter-spacing: -.04em; }
  .tagline { display: none; max-width: 560px; margin: 10px auto 0; align-items: center; gap: 12px; }
  header.top.big .tagline { display: flex; }
  .tagline i { width: 11px; height: 11px; background: var(--accent); display: block; }
  .tagline .kicker { font-weight: 700; letter-spacing: .4em; }
  header.top.big .hrow { position: relative; }
  header.top.big .hrow::after { content: ""; position: absolute; left: 190px; right: 0; bottom: 8px; height: 1px; background: var(--ink); opacity: .6; }
  header.top.big #hbtn { align-self: flex-start; margin-top: 18px; }

  main { padding: 8px 16px calc(var(--safe-bottom) + 160px); max-width: 560px; margin: 0 auto; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 12px; }
  .card.tight { padding: 2px 14px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 24px 2px 10px; }
  .section-title { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 25px; line-height: 1; letter-spacing: -.01em; }
  .link-btn { color: var(--accent); font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--ink); }
  .pill-btn { padding: 7px 12px; border: 1px solid var(--ink); border-radius: 3px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }

  /* Hero */
  .hero { position: relative; overflow: hidden; background: var(--blue); color: var(--paper); border: 0; padding: 20px 18px 16px; border-radius: 0;
    clip-path: polygon(26px 0, 100% 0, 100% 100%, 0 100%, 0 26px); min-height: 200px; }
  .hero .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 34%; background-size: cover; background-position: center; clip-path: polygon(34% 0, 100% 0, 100% 100%, 0 100%); filter: grayscale(.2) contrast(1.05); }
  .hero .sun { position: absolute; right: -26px; top: 46px; width: 84px; height: 84px; border-radius: 50%; background: var(--orange); mix-blend-mode: normal; }
  .hero .inner { position: relative; max-width: 68%; }
  .hero .go { position: absolute; right: calc(34% + 10px); top: 14px; color: var(--paper); opacity: .9; }
  .hero h3 { margin: 4px 0 0; font-family: var(--serif); font-weight: 800; font-size: 34px; letter-spacing: -.02em; line-height: 1; }
  .hero .hand { font-family: var(--serif); font-style: italic; font-size: 19px; opacity: .92; margin-top: 4px; }
  .hero hr { border: 0; height: 1px; background: rgba(250,247,242,.5); margin: 14px 0 4px; }
  .hero .item { border-bottom-color: rgba(250,247,242,.18); }
  .hero .item .meta { color: rgba(250,247,242,.75); }
  .hero .check { border-color: rgba(250,247,242,.85); border-radius: 50%; }
  .hero .check.on { background: var(--paper); color: var(--blue); }
  .hero .bar { background: rgba(250,247,242,.85) !important; width: 1.5px; }
  .hero .empty { color: rgba(250,247,242,.85); text-align: left; padding: 8px 0; }
  .hero-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; position: relative; max-width: 100%; }
  .hero-pills span { display: inline-flex; align-items: center; gap: 7px; background: rgba(250,247,242,.88); color: var(--night); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }

  /* Bento */
  .bento { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .tile { position: relative; text-align: left; padding: 14px; min-height: 128px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .tile .arrow { position: absolute; right: 12px; top: 12px; }
  .tile .name { font-family: var(--serif); font-weight: 800; font-size: 23px; letter-spacing: -.02em; line-height: 1.05; }
  .tile .info { font-size: 12.5px; line-height: 1.3; margin-top: 4px; }
  .t-cal { grid-column: 1; grid-row: 1 / 3; border: 1px solid var(--ink); background: var(--surface); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%); }
  .t-cal::after { content: ""; position: absolute; right: 0; bottom: 0; width: 57px; height: 1px; background: var(--ink); transform-origin: right bottom; transform: translate(-0px,-40px) rotate(-45deg); }
  .t-cal .dots { position: absolute; right: 14px; top: 14px; display: grid; grid-template-columns: repeat(3, 4px); gap: 6px; }
  .t-cal .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); display: block; }
  .t-cal .info { color: var(--muted); font-size: 14px; }
  .t-fin { grid-column: 2 / 4; background: var(--night); color: var(--paper); min-height: 112px; justify-content: flex-start; padding-right: 90px; }
  [data-theme="dark"] .t-fin { border: 1px solid var(--line); }
  .t-fin .row { display: flex; align-items: center; gap: 10px; }
  .t-fin .bars { position: absolute; right: 22px; bottom: 18px; display: flex; align-items: flex-end; gap: 4px; }
  .t-fin .bars i { width: 11px; display: block; background: rgba(250,247,242,.4); }
  .t-fin .bars i:last-child { background: var(--orange); }
  .t-fin .info { color: rgba(250,247,242,.9); }
  .t-fin .eye { position: absolute; right: 12px; top: 10px; padding: 4px; color: var(--paper); }
  .t-learn { grid-column: 2; background: var(--blue); color: var(--paper); }
  .t-learn .prog { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
  .t-learn .prog b { flex: 1; height: 5px; background: rgba(250,247,242,.3); position: relative; display: block; }
  .t-learn .prog b span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--paper); }
  .t-proj { grid-column: 3; border: 1px solid var(--ink); background: var(--surface); }
  .t-proj::after { content: ""; position: absolute; right: 0; bottom: 0; width: 0; height: 0; border-style: solid; border-width: 0 0 42px 42px; border-color: transparent transparent var(--orange) transparent; }
  .t-proj .info { color: var(--muted); }
  .t-mom { grid-column: 1 / -1; min-height: 120px; background-color: var(--surface-2); background-size: cover; background-position: center right; border: 0; }
  .t-mom::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--surface) 0%, rgba(250,247,242,.85) 45%, rgba(250,247,242,0) 80%); }
  [data-theme="dark"] .t-mom::before { background: linear-gradient(90deg, var(--surface) 0%, rgba(23,25,58,.85) 45%, rgba(23,25,58,0) 85%); }
  .t-mom > * { position: relative; }
  .t-mom .name { font-style: italic; font-size: 42px; font-weight: 800; letter-spacing: -.03em; }
  .t-mom .info { max-width: 62%; font-size: 13.5px; }
  .t-faith { grid-column: 1 / -1; min-height: 110px; background: linear-gradient(120deg, var(--night) 0%, #2a1d4a 100%); color: #F6EFE6; border: 0; justify-content: flex-start; gap: 2px; }
  .t-faith .kicker { color: #FFD2B0; }
  .t-faith .name { font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .t-faith .info { display: flex; align-items: center; gap: 6px; font-size: 13px; flex-wrap: wrap; }
  .t-faith .info span { font-size: 17px; opacity: .3; filter: grayscale(1); }
  .t-faith .info span.on { opacity: 1; filter: none; }
  .t-faith .info em { font-style: normal; margin-left: 6px; opacity: .85; }
  .tile-ic { margin-bottom: 8px; }

  /* Player */
  .player { display: flex; align-items: center; gap: 12px; padding: 12px 0; margin-top: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .player .vinyl { width: 104px; height: 68px; overflow: hidden; position: relative; flex: none; background: #2a2a2a; }
  .player .vinyl img { position: absolute; width: 104px; height: 104px; left: 0; top: -18px; object-fit: cover; }
  .player.running .vinyl img { animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .player .ptext { flex: 1; min-width: 0; border-left: 1px solid var(--line); padding-left: 12px; text-align: left; }
  .player .ptitle { font-weight: 700; font-size: 17px; }
  .player .psub { color: var(--muted); font-size: 13px; }
  .player .ctrl { display: flex; align-items: center; gap: 10px; }
  .player .play { width: 52px; height: 52px; border-radius: 50%; background: var(--blue); color: var(--paper); display: grid; place-items: center; }
  .quick { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 2px 16px 4px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: none; display: flex; align-items: center; gap: 7px; padding: 9px 13px; border: 1px solid var(--ink); border-radius: 3px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
  .quick button.on { background: var(--ink); color: var(--bg); }

  /* Calendar */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .month-nav .label { font-family: var(--serif); font-weight: 800; font-size: 24px; letter-spacing: -.02em; }
  .month-nav .icon-btn { width: 38px; height: 38px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal .wd { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 4px 0 8px; }
  .cal .day { aspect-ratio: 1 / 1.05; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 15px; font-weight: 500; }
  .cal .day.other { opacity: .3; }
  .cal .day.today .n { font-weight: 800; box-shadow: inset 0 -2px 0 var(--orange); }
  .cal .day.sel { background: var(--accent); color: var(--on-accent); }
  .cal .day.sel .n { font-weight: 800; box-shadow: none; }
  .dots { display: flex; gap: 3px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
  .cal .day.sel .dots i { background: var(--on-accent) !important; }

  /* Lists */
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .title.wrap { white-space: pre-wrap; overflow: visible; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item.done .title { text-decoration: line-through; opacity: .5; }
  .check { width: 22px; height: 22px; border-radius: 3px; border: 1.5px solid var(--ink); flex: none; display: grid; place-items: center; color: var(--on-accent); }
  .check.on { border-color: var(--accent); background: var(--accent); }
  .bar { width: 3px; align-self: stretch; flex: none; }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: 14px; }
  .empty .hand { font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--ink); display: block; margin-bottom: 4px; }
  .amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amount.in { color: var(--green); }
  .amount.tr { color: var(--muted); }
  .cat-ico { width: 38px; height: 38px; border-radius: 3px; display: grid; place-items: center; font-size: 18px; flex: none; background: var(--surface-2); }
  .date-head { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding: 14px 0 2px; }
  .badge { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 4px 8px; border-radius: 3px; white-space: nowrap; flex: none; }
  .tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 5px; border: 1px solid var(--line); border-radius: 2px; color: var(--muted); }

  /* Money */
  .money { background: var(--night); color: var(--paper); border: 0; padding: 18px; position: relative; overflow: hidden; clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 0 100%); }
  [data-theme="dark"] .money { background: #1C1F4A; }
  .money .kicker { opacity: .7; }
  .money .big { font-weight: 800; font-size: 40px; letter-spacing: -.03em; line-height: 1.05; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .money .lbl { font-size: 13px; opacity: .75; }
  .money .eye { position: absolute; right: 16px; top: 34px; width: 40px; height: 40px; border-radius: 50%; background: rgba(250,247,242,.12); display: grid; place-items: center; color: var(--paper); }
  .money .accs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; margin-top: 16px; background: rgba(250,247,242,.15); }
  .money .accs div { background: var(--night); padding: 10px 8px 4px 0; }
  [data-theme="dark"] .money .accs div { background: #1C1F4A; }
  .money .accs b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .money .accs .kicker { font-size: 9px; letter-spacing: .18em; }
  .money .stripe { position: absolute; left: 0; bottom: 0; height: 4px; width: 38%; background: var(--orange); }
  .warn { border-left: 3px solid var(--orange); background: rgba(255,101,0,.08); padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .actions { display: flex; gap: 8px; margin: 0 0 12px; }
  .actions button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border: 1px solid var(--ink); border-radius: 3px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat .k { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 2px; }
  .progress { height: 7px; background: var(--surface-2); overflow: hidden; margin-top: 7px; }
  .progress > span { display: block; height: 100%; background: var(--accent); }
  .progress > span.over { background: var(--red) !important; }
  .cat-row { padding: 9px 0; }
  .cat-row .line { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 14px; }
  .cat-row .line .r { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 500; }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { font-family: var(--mono); font-size: 9px; fill: var(--muted); }
  .debt { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .debt:last-child { border-bottom: 0; }
  .debt .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .debt .nm { font-family: var(--serif); font-weight: 800; font-size: 19px; }
  .debt .rk { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--orange); }
  .mini-btn { padding: 6px 10px; border: 1px solid var(--ink); border-radius: 3px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }

  /* Subjects / projects */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .scard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px; position: relative; overflow: hidden; min-height: 104px; }
  .scard .dot { width: 10px; height: 10px; margin-bottom: 12px; display: block; }
  .scard .nm { font-family: var(--serif); font-weight: 800; font-size: 17px; line-height: 1.15; }
  .scard .mt { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .pcard { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px; margin-bottom: 8px; }
  .emoji { width: 48px; height: 48px; border-radius: 3px; display: grid; place-items: center; font-size: 22px; flex: none; }
  .pcard .nm { font-family: var(--serif); font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
  .pcard .st { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pcard .mt { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .status-card { text-align: left; width: 100%; display: block; }
  .status-card .txt { white-space: pre-wrap; font-size: 15.5px; margin-top: 8px; }
  .status-card .ph { color: var(--muted); }
  .notes-area { width: 100%; min-height: 220px; background: transparent; border: 0; outline: none; resize: vertical; line-height: 1.6; }
  .log { padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; display: block; }
  .log:last-child { border-bottom: 0; }
  .log .d { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .log .t { white-space: pre-wrap; margin-top: 4px; }
  .mstars { color: var(--orange); letter-spacing: 1px; margin-left: 4px; }
  .arch-hero { position: relative; overflow: hidden; background: var(--night); color: var(--paper); border: 0; padding: 18px; background-size: cover; background-position: center; }
  .arch-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(21,23,53,.95) 30%, rgba(21,23,53,.55)); }
  .arch-hero > * { position: relative; }
  .arch-hero h3 { margin: 6px 0 0; font-family: var(--serif); font-weight: 800; font-size: 30px; line-height: 1; }
  .arch-hero .hand { font-family: var(--serif); font-style: italic; font-size: 18px; opacity: .9; margin-top: 4px; }

  /* Tab bar */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; padding: 8px 8px calc(var(--safe-bottom) + 8px); background: var(--bg); border-top: 1px solid var(--ink); }
  nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; padding: 8px 0 7px; position: relative; }
  nav.tabs button + button::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 1px; background: var(--line); }
  nav.tabs button.on { background: var(--accent); color: var(--on-accent); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  nav.tabs button.on::before, nav.tabs button.on + button::before { display: none; }
  .fab { position: fixed; right: 18px; bottom: calc(var(--safe-bottom) + 92px); z-index: 11; width: 58px; height: 58px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px); }
  .fab::after { content: ""; position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; background: var(--orange); }

  /* Sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(21,23,53,.5); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-top: 1px solid var(--ink); padding: 10px 18px calc(var(--safe-bottom) + 18px); max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.3,1); max-width: 560px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  .grab { width: 36px; height: 4px; background: var(--line); margin: 0 auto 12px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-family: var(--serif); font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .field input, .field select, .field textarea { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; outline: none; -webkit-appearance: none; appearance: none; }
  .field textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--ink); border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
  .seg button { padding: 10px 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 8px 11px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; }
  .chip.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .chips.days .chip { min-width: 44px; text-align: center; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches button { width: 34px; height: 34px; border: 3px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); }
  .swatches button.on { border-color: var(--ink); }
  .stars { display: flex; gap: 2px; padding-top: 2px; }
  .stars button { font-size: 30px; line-height: 1; color: var(--line); }
  .stars button.on { color: var(--orange); }
  .btn { width: 100%; padding: 15px; border-radius: 3px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 15px; margin-top: 6px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.danger { background: transparent; color: var(--red); }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .settings-row input { width: 120px; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; text-align: right; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 170px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 3px; font-weight: 600; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .fade { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pin { font-size: 28px !important; letter-spacing: .6em; text-align: center; }

.lists-strip button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 10px;background:var(--surface);border:1.5px solid var(--ink);text-align:left;color:inherit}
.lists-strip span{font-size:20px}
.lists-strip b{font-family:'Bodoni Moda',serif;font-size:17px}
.lists-strip i{font-style:normal;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.top3{border-left:4px solid var(--orange)}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:1px solid rgba(0,0,0,.07);background:none;color:inherit;text-align:left;font:inherit}
.li:last-child{border-bottom:0}
.li .txt{flex:1;min-width:0;font-size:16px;display:flex;flex-direction:column}
.li .txt em{font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.li .txt em.late{color:var(--orange)}
.li.done .txt{text-decoration:line-through;opacity:.5}
.li.bucket.done .txt{text-decoration:none;opacity:1}
.li .star{background:none;border:0;font-size:20px;color:rgba(0,0,0,.2);padding:0 4px}
.li .star.on{color:var(--orange)}
.li .star.del{font-size:15px}
[data-theme=dark] .li .star{color:rgba(255,255,255,.25)}
[data-theme=dark] .li .star.on{color:var(--orange)}
.top3 .li{padding:10px 0}
.add-bar{display:flex;gap:8px;margin:0 0 10px}
.add-bar input{flex:1;min-width:0;padding:14px;border:1.5px solid var(--ink);background:var(--surface);color:inherit;font:inherit;font-size:16px}
.add-bar button{width:52px;background:var(--blue);color:#fff;border:0;display:grid;place-items:center}
.chips.sugg{margin:0 0 10px}
.bemoji{font-size:22px;width:28px;text-align:center}
.bucket-hero{background:var(--night);color:#F6EFE6;border:0;margin-bottom:12px}
.bucket-hero .kicker{color:var(--orange)}
.bucket-hero .big{font-family:'Bodoni Moda',serif;font-size:54px;line-height:1;margin:6px 0 10px}
.bucket-hero .big span{font-size:26px;opacity:.6}
.price-btn.guess{border-style:dashed;opacity:.8}
.price-btn.set{background:var(--ink);color:var(--bg)}
.li.wait .txt{opacity:.7}
.shop-sum{margin-bottom:12px}
.shop-sum .big{font-family:'Bodoni Moda',serif;font-size:40px;line-height:1.05;margin:4px 0 8px}
.ss-rows div{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-top:1px solid var(--line, rgba(0,0,0,.1))}
.ss-rows div.tot{font-weight:700}
.ss-rows b{font-family:'Space Mono',monospace;font-size:13px}
.ss-rows b.neg{color:var(--orange)}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:44px;height:44px;border:1.5px solid var(--ink);background:none;color:inherit;font-size:22px}
.qty b{font-size:20px;min-width:28px;text-align:center}
.price-btn{border:1px solid var(--ink);background:none;color:inherit;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:4px 6px}

.verse .liturgy{position:relative;font-size:13px;line-height:1.45;margin-top:10px;color:#F6EFE6;opacity:.92}
.verse .liturgy .sep{margin:0 6px;opacity:.5}
.verse .v-reflect{display:none;margin-top:14px;padding-top:12px;border-top:1px solid rgba(246,239,230,.25);font-size:15px;line-height:1.5}
.verse .v-reflect.open{display:block}
.verse .v-reflect p{margin:0 0 8px}
.verse .v-reflect .q{font-family:'Bodoni Moda',serif;font-style:italic;font-size:17px;color:#FFD2B0}
.verse .v-actions{display:flex;gap:8px;margin-top:12px}
.verse .v-actions button{flex:1;padding:10px;border:1px solid rgba(246,239,230,.4);background:rgba(21,23,53,.35);color:#F6EFE6;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.mood-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.mood-verse{padding:16px;background:var(--night);color:#F6EFE6}
.mood-verse blockquote{margin:0 0 8px;font-family:'Bodoni Moda',serif;font-style:italic;font-size:20px;line-height:1.35}
.mood-verse .v-ref{font-family:'Space Mono',monospace;font-size:12px;text-transform:uppercase;opacity:.8;margin-bottom:10px}
.mood-verse p{margin:0 0 6px;font-size:15px;line-height:1.5;opacity:.9}
.mood-verse .mini-btn{border-color:rgba(246,239,230,.5);color:#F6EFE6}

const parseAmount = s => { const n = parseFloat(String(s).replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const shortDate = s => { const d = parseYmd(s); return `${d.getDate()}. ${MONTHS_GEN[d.getMonth()]}`; };
const fullDate = s => { const d = parseYmd(s); return `${cap(DAYS[d.getDay()])}, ${shortDate(s)}`; };
const fmtMin = m => { m = Math.round(m || 0); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`; };
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? few : many; };
function niceDate(s) {
  const t = todayStr();
  if (s === t) return `Danas, ${shortDate(s)}`;
  if (s === addDays(t, 1)) return `Sutra, ${shortDate(s)}`;
  if (s === addDays(t, -1)) return `Jučer, ${shortDate(s)}`;
  return fullDate(s);
}
function daysUntil(s) { return Math.round((parseYmd(s) - parseYmd(todayStr())) / 86400000); }
function countdown(s) {
  const n = daysUntil(s);
  if (n < 0) return 'prošlo';
  if (n === 0) return 'danas';
  if (n === 1) return 'sutra';
  return `za ${n} ${n % 10 === 1 && n % 100 !== 11 ? 'dan' : 'dana'}`;
}

/* Ponavljajuće obaveze */
const isRec = e => e.repeat === 'weekly' || e.repeat === 'yearly';
function occursOn(e, s) {
  if (e.repeat === 'weekly') return s >= e.date && (e.days || []).includes(wdIdx(s));
  if (e.repeat === 'yearly') return s.slice(5) === e.date.slice(5);
  return e.date === s;
}
const isDone = (e, d) => isRec(e) ? (e.doneDates || []).includes(d) : !!e.done;
function toggleDone(e, d) {
  if (isRec(e)) { e.doneDates ||= []; const i = e.doneDates.indexOf(d); if (i >= 0) e.doneDates.splice(i, 1); else e.doneDates.push(d); }
  else e.done = !e.done;
}
function sortOcc(a, b) { if (a.done !== b.done) return a.done ? 1 : -1; return (a.e.time || '99:99').localeCompare(b.e.time || '99:99'); }
function occs(from, to, filter) {
  const out = [], rec = [];
  for (const e of state.events) {
    if (filter && !filter(e)) continue;
    if (isRec(e)) rec.push(e);
    else if (e.date >= from && e.date <= to) out.push({ e, d: e.date, done: !!e.done });
  }
  if (rec.length) for (let s = from; s <= to; s = addDays(s, 1)) for (const e of rec) if (occursOn(e, s)) out.push({ e, d: s, done: isDone(e, s) });
  return out.sort((a, b) => a.d.localeCompare(b.d) || sortOcc(a, b));
}

function monthTotals(y, m) {
  const prefix = `${y}-${pad(m+1)}`;
  const txs = state.tx.filter(t => t.date.startsWith(prefix));
  const income = txs.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
  const spent = txs.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
  return { txs, income, spent, left: income - spent };
}

function verseOfDay(dateStr, shift) {
  const d = parseYmd(dateStr);
  const start = new Date(d.getFullYear(), 0, 0);
  const doy = Math.round((d - start) / 86400000);
  const i = ((doy * 37 + d.getFullYear() + (shift || 0)) % VERSES.length + VERSES.length) % VERSES.length;
  return { i, text: VERSES[i][0], ref: VERSES[i][1] };
}

function easterDate(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return ymd(new Date(y, month - 1, day));
}
function adventStart(y) { const xmas = new Date(y, 11, 25); const wd = xmas.getDay(); return ymd(new Date(y, 11, 25 - (wd === 0 ? 7 : wd) - 21)); }
function feastsOf(y) {

    f(`${y}-01-01`, 'Sveta Marija Bogorodica'), f(`${y}-01-06`, 'Bogojavljenje (Sveta tri kralja)'), f(`${y}-02-02`, 'Svijećnica'),
    f(addDays(E, -46), 'Pepelnica – početak Korizme'), f(`${y}-03-25`, 'Blagovijest'), f(addDays(E, -7), 'Cvjetnica'),
    f(addDays(E, -3), 'Veliki četvrtak'), f(addDays(E, -2), 'Veliki petak'), f(addDays(E, -1), 'Velika subota'),
    f(E, 'Uskrs'), f(addDays(E, 1), 'Uskrsni ponedjeljak'), f(addDays(E, 39), 'Uzašašće'), f(addDays(E, 49), 'Duhovi'),
    f(addDays(E, 60), 'Tijelovo'), f(`${y}-08-15`, 'Velika Gospa'), f(`${y}-11-01`, 'Svi sveti'), f(`${y}-11-02`, 'Dušni dan'),
    f(adventStart(y), '1. nedjelja Adventa'), f(`${y}-12-08`, 'Bezgrešno začeće BDM'), f(`${y}-12-24`, 'Badnjak'),
    f(`${y}-12-25`, 'Božić'), f(`${y}-12-26`, 'Sveti Stjepan'),
  ];
}
function liturgyToday() {
  const t = todayStr(), y = parseYmd(t).getFullYear();
  const feasts = [...feastsOf(y), ...feastsOf(y + 1)];
  const today = feasts.find(x => x.d === t);
  const next = feasts.filter(x => x.d > t).sort((a, b) => a.d.localeCompare(b.d))[0];
  const E = easterDate(y), adv = adventStart(y), ash = addDays(E, -46), pent = addDays(E, 49);
  let season = null;
  if (t >= adv && t <= `${y}-12-24`) {
    const week = Math.floor(daysUntil(adv) * -1 / 7) + 1, left = daysUntil(`${y}-12-25`);
    season = { name: `${week}. tjedan Adventa`, icon: '🕯️'.repeat(Math.min(4, week)), extra: left === 1 ? 'sutra je Božić' : `još ${left} ${plural(left, 'dan', 'dana', 'dana')} do Božića`, color: '#8A5BD6' };
  } else if (t >= `${y}-12-25` || t <= `${y}-01-12`) season = { name: 'Božićno vrijeme', icon: '⭐', extra: '', color: '#E8C35A' };
  else if (t >= ash && t < E) { const left = daysUntil(E); season = { name: 'Korizma', icon: '✝️', extra: `još ${left} ${plural(left, 'dan', 'dana', 'dana')} do Uskrsa`, color: '#8A5BD6' }; }
  else if (t >= E && t <= pent) season = { name: 'Vazmeno vrijeme', icon: '🕊️', extra: `do Duhova ${daysUntil(pent)} ${plural(daysUntil(pent), 'dan', 'dana', 'dana')}`, color: '#E8C35A' };
  const sunday = parseYmd(t).getDay() === 0;
  return { today, next, season, sunday };
}

    const entry = { id: uid(), date: todayStr(), minutes, target: focus.target || '' };

}

function renderPlanner() {
  setHeader('Kalendar', 'The schedule');

  for (const o of all) (byDate[o.d] ||= []).push(o);
  let cells = WD_SHORT.map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const s = addDays(start, i); const d = parseYmd(s);

    const cls = ['day', d.getMonth() !== m && 'other', s === today && 'today', s === ui.sel && 'sel'].filter(Boolean).join(' ');

  }
  const dayOccs = occs(ui.sel, ui.sel);

  view.innerHTML = `

function shiftCal(d) { ui.calM += d; if (ui.calM < 0) { ui.calM = 11; ui.calY--; } if (ui.calM > 11) { ui.calM = 0; ui.calY++; } render(); }
function eventColor(e) { const s = e.subjectId && subjectById(e.subjectId); return s ? s.color : evCat(e.cat).color; }
function eventLabel(e) { const s = e.subjectId && subjectById(e.subjectId); return s ? `${s.name}: ${e.title}` : e.title; }
function eventRow(o, showDate, showCountdown) {
  const { e, d, done } = o;

  const color = eventColor(e);

const MONTH_STEMS = ['sijeC', 'veljaC', 'oZuj', 'trav', 'svib', 'lip', 'srp', 'kolovoz', 'ruj', 'listopad', 'studen', 'prosin'];
const TX_KEYWORDS = [
  ['hrana', /\b(kav[aeu]|kafiK|ruCak|ruCk|doruCak|veCer[au]|hran[aeu]|konzum|lidl|spar|kaufland|plodine|tommy|studenac|pekar|burek|pizz|duKan|namirnic|market|piKa?)\b/],
  ['prijevoz', /\b(goriv|benzin|dizel|bus|autobus|tramvaj|zet|taksi|uber|bolt|parking|vlak|cestarin|karta za)/],
  ['stan', /\b(najam|najamnin|stanarin|struj|reZij|vod[aeu]|plin|internet|hep|stan\b)/],
  ['pretplate', /\b(netflix|spotify|youtube|hbo|disney|max|pretplat|icloud|chatgpt|claude)/],
  ['izlasci', /\b(izlaz|izlask|bar\b|klub|kino|restoran|koktel|pivo|piv[ao]|caffe bar)/],
  ['faks', /\b(faks|Skolarin|knjig|skript|teCaj|udZbenik|ispit)/],
  ['otplata', /\b(rat[aeu]|kredit|otplat|minus)/],
  ['kupovina', /\b(odjeK|zara|h&m|kupil|kupio|cipel|tenisic|kozmetik|dm\b|müller|muller|poklon)/],
];
const INCOME_RE = /\b(plaKa|plaKu|plaKe|primila|dobila|uplatili|uplata|uplatio|honorar|freelance|klijent|zaradila|povrat)\b/;
const EVENT_CAT_RE = [
  ['trening', /\b(trening|teretan|gym|utezanj|pilates|joga|yoga|trCanj)/],
  ['rodjendan', /\b(roDendan|rodjendan)/],
  ['faks', /\b(faks|predavanj|ispit|kolokvij|kolok|vjeZb[ae]|seminar|rok|zadaK|projekt za faks)/],
  ['posao', /\b(posao|poslu|sastan|meeting|Sef|direktor|inventur)/],
];

function vNormalize(s) {
  return ' ' + s.replace(/[“”„"!?]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
}

function wordsToDigits(s) {
  // "dvadeset pet" -> 25, "tri" -> 3 (samo kad stoji kao zasebna rijeC)
  return s.replace(/\b(dvadeset|trideset|Cetrdeset|pedeset|Sezdeset|sedamdeset|osamdeset|devedeset)(?: i)? (jedan|jedna|dva|dvije|tri|Cetiri|pet|Sest|sedam|osam|devet)\b/g,
    (m, a, b) => String(NUM_WORDS[a] + NUM_WORDS[b]))
    .replace(/\b(nula|jedan|jedna|jednu|dva|dvije|tri|Cetiri|pet|Sest|sedam|osam|devet|deset|jedanaest|dvanaest|trinaest|Cetrnaest|petnaest|Sesnaest|sedamnaest|osamnaest|devetnaest|dvadeset|trideset|Cetrdeset|pedeset|Sezdeset|sedamdeset|osamdeset|devedeset|sto|stotinu)\b/g,
      (m) => String(NUM_WORDS[m]));
}

function parseSmart(input) {
  const raw = input.trim();
  if (!raw) return null;
  let s = vNormalize(wordsToDigits(toKey(raw.toLowerCase())));
  const today = todayStr();
  const res = { kind: 'event', title: '', date: null, time: '', cat: 'osobno', repeat: 'none', days: [], amount: null, txType: 'out', txCat: 'ostalo', acc: 'tekuci', text: raw };
  const strip = re => { s = s.replace(re, ' '); };

  // --- ideja
  const ideaM = s.match(/^\s*(?:zapiSi |nova |brza )?ideja:?\s+(.*)$/) || s.match(/^\s*(?:zapiSi |dodaj )?ideju:?\s+(.*)$/);
  if (ideaM) { res.kind = 'idea'; res.text = fromKey(ideaM[1].trim()); res.text = res.text.charAt(0).toUpperCase() + res.text.slice(1); return res; }

  const fromRaw = t => { const i = raw.toLowerCase().lastIndexOf(t.toLowerCase()); return i >= 0 ? raw.slice(i, i + t.length) : t; };
  const shopM = s.match(/^\s*(?:kupi(?:ti)?|dodaj na popis|na popis|za duKan|popis za duKan:?|kupovina:?)\s+(.*)$/);
  if (shopM) { res.kind = 'shop'; res.text = fromRaw(fromKey(shopM[1].trim())); return res; }
  const todoM = s.match(/^\s*(?:to ?do:?|zadatak:?|moram|trebam)\s+(.*)$/);
  if (todoM && !/\b(sutra|danas|prekosutra|\d{1,2}[.:]\d{2}|u \d{1,2})\b/.test(todoM[1]) && !/\d+([.,]\d+)?\s*(€|eur)/.test(todoM[1])) { res.kind = 'todo'; res.text = fromRaw(fromKey(todoM[1].trim())); res.text = res.text.charAt(0).toUpperCase() + res.text.slice(1); return res; }
  const wishM = s.match(/^\s*(?:Zelim(?: si)?(?: kupiti| kupit)?|Zelja:?|lista Zelja:?)\s+(.*)$/);
  if (wishM) { res.wish = true; s = ' ' + wishM[1] + ' '; }

  // --- iznos (novac)
  let amount = null;
  const am = s.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur\b|eura\b|euro\b|eure\b|e\b)(?:\s*(?:i\s*)?(\d{1,2})\s*(?:centi|cent|c)\b)?/);
  if (am) { amount = parseFloat(am[1].replace(',', '.')) + (am[2] ? +am[2] / 100 : 0); strip(am[0]); }
  else {
    const am2 = s.match(/\b(?:potroSila|potroSio|platila|platio|dala|dao|primila|dobila|zaradila|uplata)\s+(?:sam\s+)?(\d+(?:[.,]\d{1,2})?)\b/);
    if (am2) { amount = parseFloat(am2[1].replace(',', '.')); s = s.replace(am2[1], ' '); }
  }
  if (amount !== null && amount > 0) {
    res.kind = 'tx'; res.amount = Math.round(amount * 100) / 100;
    if (INCOME_RE.test(s)) { res.txType = 'in'; res.txCat = /freelance|klijent|honorar/.test(s) ? 'freelance' : /plaK/.test(s) ? 'placa' : 'ostalo-in'; }
    else { const k = TX_KEYWORDS.find(([, re]) => re.test(s)); res.txCat = k ? k[0] : 'ostalo'; }
    if (/Stedn|Stednj/.test(s)) res.acc = 'stedni';
  }

  // --- ponavljanje "svaki ponedjeljak i srijedu"
  const every = s.match(/\bsvak(?:i|u|e|og)\s+((?:\w+(?:,|\s+i\s+|\s+)?)+)/);
  if (every && res.kind === 'event') {
    const days = [];
    WD_STEMS.forEach((st, i) => { if (new RegExp('\\b' + st).test(every[1])) days.push(i); });
    if (days.length) { res.repeat = 'weekly'; res.days = days; strip(/\bsvak(?:i|u|e|og)\b/); WD_STEMS.forEach(st => strip(new RegExp('\\b' + st + '\\w*\\b', 'g'))); strip(/\b(i|,)\b(?=\s*$)/); }
    if (/\bsvak(?:i|e) godin|godiSnje/.test(s)) { res.repeat = 'yearly'; strip(/\bsvak(?:i|e) godin\w*|godiSnje/); }
  }

  // --- datum
  let date = null;
  const rel = [[/\bprekosutra\b/, 2], [/\bsutra\b/, 1], [/\bdanas\b/, 0], [/\bjuCer\b/, -1], [/\bprekjuCer\b/, -2]];
  for (const [re, n] of rel) if (re.test(s)) { date = addDays(today, n); strip(re); break; }
  if (!date) {
    const za = s.match(/\bza (\d+) (dan|dana|tjedan|tjedna|tjedana)\b/);
    if (za) { date = addDays(today, /tjed/.test(za[2]) ? +za[1] * 7 : +za[1]); strip(za[0]); }
  }
  if (!date && /\b(iduKi|sljedeKi) tjedan\b/.test(s) && !WD_STEMS.some(st => new RegExp('\\b' + st).test(s))) { date = addDays(today, 7 - wdIdx(today)); strip(/\b(iduKi|sljedeKi) tjedan\b/); }
  if (!date) {
    const dm = s.match(/\b(\d{1,2})\.\s*(\d{1,2})\.(?:\s*(\d{4})\.?)?/);
    const dn = s.match(/\b(\d{1,2})\.?\s+(sijeC\w*|veljaC\w*|oZuj\w*|trav\w*|svib\w*|lip\w*|srp\w*|kolovoz\w*|ruj\w*|listopad\w*|studen\w*|prosin\w*)(?:\s+(\d{4}))?/);
    let d = null, m = null, y = null, tok = null;
    if (dm) { d = +dm[1]; m = +dm[2] - 1; y = dm[3] ? +dm[3] : null; tok = dm[0]; }
    else if (dn) { d = +dn[1]; m = MONTH_STEMS.findIndex(st => dn[2].startsWith(st)); y = dn[3] ? +dn[3] : null; tok = dn[0]; }
    if (tok && d >= 1 && d <= 31 && m >= 0 && m <= 11) {
      const t = parseYmd(today); let yy = y || t.getFullYear();
      let cand = ymd(new Date(yy, m, d));
      if (!y && cand < today && res.kind !== 'tx') cand = ymd(new Date(yy + 1, m, d));
      date = cand; strip(tok);
    }
  }
  if (!date && res.repeat !== 'weekly') {
    const wi = WD_STEMS.findIndex(st => new RegExp('\\b' + st).test(s));
    if (wi >= 0) {
      const cur = wdIdx(today);
      let diff = (wi - cur + 7) % 7;
      if (res.kind === 'tx') diff = diff === 0 ? 0 : diff - 7; // troSak "u petak" = proSli petak
      else { if (diff === 0) diff = 7; if (/\b(iduKi|sljedeKi)\b/.test(s) && diff < 7) diff += 0; }
      date = addDays(today, diff);
      strip(new RegExp('\\b(u|na|ovaj|ovu|ovog|iduKi|iduKu|sljedeKi|sljedeKu)?\\s*' + WD_STEMS[wi] + '\\w*', 'g'));
    }
  }

  // --- vrijeme
  if (res.kind === 'event') {
    let h = null, mi = 0, tm;
    if ((tm = s.match(/\b(?:u\s+)?pola\s+(\d{1,2})\b/))) { h = +tm[1] - 1; mi = 30; }
    else if ((tm = s.match(/\b(?:u|od|oko)\s+(\d{1,2})(?:[:.](\d{2})|\s*h\b|\s+sati\b|\s+i\s+(\d{1,2})\b)?/))) { h = +tm[1]; mi = +(tm[2] || tm[3] || 0); }
    else if ((tm = s.match(/\b(\d{1,2})[:.](\d{2})\b/)) || (tm = s.match(/\b(\d{1,2})\s*h\b/))) { h = +tm[1]; mi = +(tm[2] || 0); }
    if (h !== null && h <= 24 && mi < 60) {
      const pm = /\b(popodne|poslijepodne|naveCer|uveCer|navecer)\b/.test(s);
      if (pm && h < 12) h += 12;
      if (!pm && !/\bujutro\b/.test(s) && h >= 1 && h <= 6 && !tm[0].includes(':')) h += 12; // "u 5" je najCeSKe 17h
      res.time = `${pad(h % 24)}:${pad(mi)}`;
      strip(tm[0]); strip(/\b(popodne|poslijepodne|naveCer|uveCer|ujutro|sati|h)\b/g);
    }
  }

  if (res.wish) { res.kind = 'wish'; }
  res.date = date || (res.repeat === 'weekly' ? (() => { const cur = wdIdx(today); const first = res.days.map(d => (d - cur + 7) % 7).sort((a, b) => a - b)[0]; return addDays(today, first); })() : today);

  // --- kategorija obaveze
  if (res.kind === 'event') {
    const c = EVENT_CAT_RE.find(([, re]) => re.test(s));
    if (c) res.cat = c[0];
    if (res.cat === 'rodjendan') res.repeat = 'yearly';
  }

  // --- naslov / opis
  let t = s
    .replace(/\b(dodaj|upiSi|zapiSi|stavi|podsjeti me|podsjetnik|obaveza|imam|trebam|moram|potroSila sam|potroSio sam|potroSila|potroSio|platila sam|platio sam|platila|platio|primila sam|dobila sam|kupila sam|kupio sam|kupila|kupio|sa Stednog|sa Stednje|sa tekuKeg|na|za|u|sam|je|mi)\b/g, ' ')
    .replace(/\b(troSak|prihod)\b/g, ' ')
    .replace(/[,.:;]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (res.kind === 'event' && res.cat === 'rodjendan') t = t.replace(/\b(roDendan|rodjendan)\b/, '').replace(/\s+/g, ' ').trim().replace(/^od\s+/, '');
  t = t.replace(/^(i|s|sa|od|iz|te)\s+/, '').replace(/\s+(i|s|sa|te)$/, '').trim();
  t = fromKey(t);
  const caps = {}; raw.split(/[\s,.:;!?]+/).forEach(w => { if (/[A-ZČĆĐŠŽ]/.test(w)) caps[w.toLowerCase()] = w; });
  t = t.split(' ').map(w => caps[w] || w).join(' ');
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (res.kind === 'tx') res.title = t;
  else if (res.cat === 'trening' && (!t || /^(trening|teretana|gym|utezanje)$/i.test(t))) res.title = 'Trening';
  else res.title = t;
  return res;
}

function smartPreview(r) {
  if (!r) return `<div class="empty">Reci ili upiši npr. <b>„sutra u 18 trening”</b>, <b>„kava 3,50 eura”</b>, <b>„svaki ponedjeljak i srijedu u 7 teretana”</b>, <b>„rođendan Ana 12. prosinca”</b> ili <b>„ideja: vez na trapericama”</b>.</div>`;
  if (r.kind === 'idea') return `<div class="sp-kind">${icon('lightbulb', 16)} Ideja</div><div class="sp-title">${esc(r.text)}</div>`;
  if (r.kind === 'shop') return `<div class="sp-kind">🛒 Kupovina</div><div class="sp-title">${esc(r.text)}</div><div class="sp-meta"><span>na popis za dućan</span></div>`;
  if (r.kind === 'todo') return `<div class="sp-kind">☑︎ To-do</div><div class="sp-title">${esc(r.text)}</div>`;
  if (r.kind === 'wish') return `<div class="sp-kind">${icon('heart', 16)} Lista želja</div><div class="sp-title">${esc(r.title || 'Želja')}</div><div class="sp-meta">${r.amount ? `<span>${money(r.amount)}</span>` : '<span>dodaj cijenu</span>'}<span>pravilo 30 dana</span></div>`;
  if (r.kind === 'tx') {
    const cats = r.txType === 'in' ? INCOME_CATS : EXPENSE_CATS; const c = cats.find(x => x.id === r.txCat) || cats[cats.length - 1];
    return `<div class="sp-kind">${icon('wallet', 16)} ${r.txType === 'in' ? 'Prihod' : 'Trošak'}</div>
      <div class="sp-title">${money(r.amount)}</div>
      <div class="sp-meta"><span>${c.ico} ${c.name}</span><span>${niceDate(r.date)}</span><span>${r.acc === 'stedni' ? 'Štedni' : 'Tekući'}</span>${r.title ? `<span>${esc(r.title)}</span>` : ''}</div>`;
  }
  const c = EVENT_CATS.find(x => x.id === r.cat);
  const rep = r.repeat === 'weekly' ? 'svaki ' + r.days.map(d => DAYS[(d + 1) % 7]).join(', ') : r.repeat === 'yearly' ? 'svake godine' : niceDate(r.date);
  return `<div class="sp-kind">${icon('calendar-days', 16)} Obaveza</div>
    <div class="sp-title">${esc(r.title || 'Bez naziva')}</div>
    <div class="sp-meta"><span style="color:${c.color}">● ${c.name}</span><span>${rep}</span>${r.time ? `<span>${r.time}</span>` : ''}</div>`;
}

function saveSmart(r) {
  if (r.kind === 'idea') { const i = { id: uid(), text: r.text, date: todayStr() }; state.inbox.push(i); return { type: 'idea', item: i }; }
  if (r.kind === 'shop') { addShopItems(r.text); return { type: 'shop' }; }
  if (r.kind === 'todo') { const t = { id: uid(), text: r.text, done: false, star: false, created: todayStr() }; listsInit().todo.push(t); return { type: 'todo', item: t }; }
  if (r.kind === 'wish') { state.wishes ||= []; const w = { id: uid(), added: todayStr(), name: r.title || 'Želja', price: r.amount || 0, need: false, link: '' }; state.wishes.push(w); return { type: 'wish', item: w }; }
  if (r.kind === 'tx') {
    const t = { id: uid(), created: Date.now(), type: r.txType, amount: r.amount, cat: r.txCat, acc: r.acc, date: r.date, note: r.title };
    state.tx.push(t); return { type: 'tx', item: t };
  }
  const e = { id: uid(), done: false, doneDates: [], title: r.title || 'Obaveza', date: r.date, time: r.time, cat: r.cat, note: '', subjectId: '', repeat: r.repeat, days: r.repeat === 'weekly' ? r.days : [] };
  state.events.push(e); return { type: 'event', item: e };
}

let recog = null;
function openSmartSheet() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  openSheet('Reci ili upiši', `
    <div class="smart">
      <button class="mic-big" id="micBtn" aria-label="Govori">${icon('mic', 34, 1.8)}</button>
      <div class="mic-hint" id="micHint">${SR ? 'Dodirni mikrofon i reci' : 'Dodirni polje i stisni mikrofon na tipkovnici'}</div>
      <div class="field"><textarea id="smartText" rows="2" placeholder="npr. sutra u 18 trening"></textarea></div>
      <div class="smart-prev" id="smartPrev">${smartPreview(null)}</div>
      <button class="btn" id="smartSave" disabled>Spremi</button>
      <button class="btn ghost" id="smartEdit" disabled>Spremi i uredi detalje</button>
    </div>`);
  const ta = document.getElementById('smartText'), prev = document.getElementById('smartPrev');
  const saveB = document.getElementById('smartSave'), editB = document.getElementById('smartEdit');
  let parsed = null;
  const update = () => { parsed = parseSmart(ta.value); prev.innerHTML = smartPreview(parsed); saveB.disabled = editB.disabled = !parsed || (parsed.kind === 'event' && !parsed.title) || (parsed.kind === 'idea' && !parsed.text) || (parsed.kind === 'wish' && !parsed.amount); };
  ta.oninput = update;
  const stopRec = () => { if (recog) { try { recog.stop(); } catch (e) {} } };
  document.getElementById('micBtn').onclick = () => {
    const btn = document.getElementById('micBtn'), hint = document.getElementById('micHint');
    if (!SR) { ta.focus(); return; }
    if (btn.classList.contains('on')) { stopRec(); return; }
    try {
      recog = new SR(); recog.lang = 'hr-HR'; recog.interimResults = true; recog.continuous = false;
      const base = ta.value ? ta.value.trim() + ' ' : '';
      recog.onresult = ev => { let txt = ''; for (const r of ev.results) txt += r[0].transcript; ta.value = base + txt; update(); };
      recog.onstart = () => { btn.classList.add('on'); hint.textContent = 'Slušam…'; };
      recog.onend = () => { btn.classList.remove('on'); hint.textContent = ta.value ? 'Provjeri pa spremi' : 'Dodirni mikrofon i reci'; };
      recog.onerror = ev => {
        btn.classList.remove('on');
        hint.textContent = ev.error === 'not-allowed' ? 'Mikrofon nije dopušten – koristi mikrofon na tipkovnici' : 'Nije uspjelo – probaj mikrofon na tipkovnici';
        ta.focus();
      };
      recog.start();
    } catch (e) { hint.textContent = 'Koristi mikrofon na tipkovnici'; ta.focus(); }
  };
  const done = edit => {
    if (!parsed) return; stopRec();
    const s = saveSmart(parsed); save(); closeSheet(); render();
    toast(s.type === 'tx' ? (s.item.type === 'in' ? 'Prihod spremljen' : 'Trošak spremljen') : s.type === 'idea' ? 'Ideja spremljena' : s.type === 'wish' ? '⏳ Na listi želja' : s.type === 'shop' ? '🛒 Na popisu za dućan' : s.type === 'todo' ? '☑︎ Dodano u To-do' : 'Obaveza spremljena');
    if (edit && (s.type === 'shop' || s.type === 'todo')) { ui.listSeg = s.type; setTimeout(() => go('liste'), 320); return; }
    if (edit) setTimeout(() => s.type === 'wish' ? openWishSheet(s.item) : s.type === 'tx' ? openTxSheet(s.item) : s.type === 'idea' ? openIdeaSheet(s.item, null) : openEventSheet(s.item), 320);
  };
  saveB.onclick = () => done(false);
  editB.onclick = () => done(true);
}


/* ===================== FINANCIJE (The Money Dept.) ===================== */
function txEffect(t, acc) {
  const a = t.acc || 'tekuci';
  if (t.type === 'in') return a === acc ? t.amount : 0;
  if (t.type === 'out') return a === acc ? -t.amount : 0;
  if (t.type === 'transfer') return (a === acc ? -t.amount : 0) + (t.acc2 === acc ? t.amount : 0);
  if (t.type === 'adjust') return a === acc ? t.amount : 0;
  return 0;
}
function accBalance(id) { const a = accById(id); return (a.start || 0) + state.tx.reduce((s, t) => s + txEffect(t, id), 0); }

/* Planirane stavke */
function planOccDates(p, from, to) {
  const out = [];
  if (p.repeat === 'monthly') {
    const base = parseYmd(p.date); const day = base.getDate();
    let y = base.getFullYear(), m = base.getMonth();
    for (let i = 0; i < 240; i++) {
      const last = new Date(y, m + 1, 0).getDate();
      const s = ymd(new Date(y, m, Math.min(day, last)));
      if (s > to) break;
      if (s >= from && (!p.until || s <= p.until)) out.push(s);
      m++; if (m > 11) { m = 0; y++; }
    }
  } else if (p.date >= from && p.date <= to) out.push(p.date);
  return out;
}
const planHandled = (p, d) => (p.doneDates || []).includes(d) || (p.skipDates || []).includes(d);
function pendingPlanned() {
  const t = todayStr(), out = [];
  for (const p of state.planned) for (const d of planOccDates(p, addDays(t, -120), t)) if (!planHandled(p, d)) out.push({ p, d });
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
function upcomingPlanned(days) {
  const t = todayStr(), out = [];
  for (const p of state.planned) for (const d of planOccDates(p, addDays(t, 1), addDays(t, days))) if (!planHandled(p, d)) out.push({ p, d });
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
function planEffect(p, acc) { return txEffect({ type: p.type, amount: p.amount, acc: p.acc, acc2: p.acc2 }, acc); }
function projection(acc, days) {
  const t = todayStr();
  let bal = accBalance(acc);
  for (const o of pendingPlanned()) bal += planEffect(o.p, acc);
  const byDay = {};
  for (const o of upcomingPlanned(days)) (byDay[o.d] ||= []).push(o);
  const pts = [{ d: t, b: bal }];
  for (let i = 1; i <= days; i++) { const d = addDays(t, i); for (const o of byDay[d] || []) bal += planEffect(o.p, acc); pts.push({ d, b: bal }); }
  return pts;
}
function confirmPlanned(p, d, amount) {
  state.tx.push({ id: uid(), created: Date.now(), type: p.type, amount: amount ?? p.amount, cat: p.cat, acc: p.acc, acc2: p.acc2, date: d > todayStr() ? todayStr() : d, note: p.note || '', planId: p.id });
  p.doneDates ||= []; p.doneDates.push(d);
  if (p.debtId) { const dbt = state.debts.find(x => x.id === p.debtId); if (dbt) { const a = amount ?? p.amount; dbt.balance = Math.max(0, Math.round((dbt.balance - a) * 100) / 100); dbt.payments ||= []; dbt.payments.push({ date: d, amount: a, kind: 'rata' }); } }
  save();
}

/* Dugovi */
function debtPayoff(dbt) {
  const B = dbt.balance, P = dbt.payment, r = (dbt.rate || 0) / 1200;
  if (!(B > 0)) return { months: 0 };
  if (!(P > 0)) return { months: null };
  if (r > 0) { if (P <= r * B) return { months: Infinity }; return { months: Math.ceil(-Math.log(1 - r * B / P) / Math.log(1 + r)) }; }
  return { months: Math.ceil(B / P) };
}
function monthsToDate(n) { const d = new Date(); d.setMonth(d.getMonth() + n); return `${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}.`; }
function orderedDebts() {
  const list = state.debts.filter(d => d.balance > 0);
  return state.settings.debtStrategy === 'avalanche' ? list.sort((a, b) => (b.rate || 0) - (a.rate || 0) || a.balance - b.balance) : list.sort((a, b) => a.balance - b.balance);
}

function chartSvg(pts, overdraft) {
  const W = 340, H = 170, L = 6, R = 6, T = 14, B = 22;
  const vals = pts.map(p => p.b);
  let lo = Math.min(...vals, -overdraft, 0), hi = Math.max(...vals, 0);
  const padv = (hi - lo) * .08 || 50; lo -= padv; hi += padv;
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const yv = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${yv(p.b).toFixed(1)}`).join('');
  const area = `${path}L${x(pts.length - 1).toFixed(1)},${yv(lo).toFixed(1)}L${x(0)},${yv(lo).toFixed(1)}Z`;
  let mi = 0; vals.forEach((v, i) => { if (v < vals[mi]) mi = i; });
  const ticks = [0, 15, 30, 45, 60].filter(i => i < pts.length).map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${parseYmd(pts[i].d).getDate()}.${parseYmd(pts[i].d).getMonth() + 1}.</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <path d="${area}" fill="var(--accent)" opacity=".08"/>
    <line x1="${L}" x2="${W - R}" y1="${yv(0)}" y2="${yv(0)}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>
    <text x="${W - R}" y="${yv(0) - 4}" text-anchor="end">0 €</text>
    ${overdraft ? `<line x1="${L}" x2="${W - R}" y1="${yv(-overdraft)}" y2="${yv(-overdraft)}" stroke="var(--orange)" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="${W - R}" y="${yv(-overdraft) - 4}" text-anchor="end" style="fill:var(--orange)">limit minusa${ui.reveal ? ' ' + money(-overdraft) : ''}</text>` : ''}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(mi)}" cy="${yv(vals[mi])}" r="4.5" fill="var(--orange)"/>
    <circle cx="${x(0)}" cy="${yv(vals[0])}" r="3.5" fill="var(--accent)"/>
    ${ticks}
  </svg>`;
}

function finPlan(bTek, tek) {

  return `

    <div class="sec-head"><span class="section-title">Dolazi</span><span class="kicker" style="color:var(--muted)">60 dana</span></div>
    <div class="card tight">${up.length ? up.slice(0, 25).map(o => planRow(o)).join('') : emptyArt('', 'ništa planirano', 'Dodaj plaću, stanarinu, račune… sve što znaš da dolazi.')}</div>

}

/* ===================== CASH FLOW – detaljno ===================== */
function cfData(acc, days, whatIf) {
  const t = todayStr();
  let pts = projection(acc, days);
  if (whatIf && whatIf.amount > 0) pts = pts.map(p => ({ ...p, b: p.d >= whatIf.date ? p.b - whatIf.amount : p.b }));
  const items = {};
  for (const o of pendingPlanned()) (items[t] ||= []).push({ ...o, late: true });
  for (const o of upcomingPlanned(days)) (items[o.d] ||= []).push(o);
  return { pts, items };
}
function cfChart(pts, items, acc, od, base) {
  const W = 360, H = 230, L = 8, R = 8, T = 16, B = 26;
  const vals = pts.map(p => p.b).concat(base ? base.map(p => p.b) : []);
  let lo = Math.min(...vals, acc === 'tekuci' ? -od : 0, 0), hi = Math.max(...vals, 0);
  const padv = (hi - lo) * .08 || 50; lo -= padv; hi += padv;
  const n = pts.length;
  const x = i => L + i * (W - L - R) / (n - 1);
  const yv = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const line = arr => arr.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${yv(p.b).toFixed(1)}`).join('');
  const path = line(pts);
  const area = `${path}L${x(n - 1).toFixed(1)},${yv(lo).toFixed(1)}L${x(0)},${yv(lo).toFixed(1)}Z`;
  const step = n > 120 ? 30 : n > 60 ? 15 : n > 31 ? 10 : 7;
  const ticks = [];
  for (let i = 0; i < n; i += step) ticks.push(i);
  const tickSvg = ticks.map(i => { const d = parseYmd(pts[i].d); return `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : 'middle'}">${d.getDate()}.${d.getMonth() + 1}.</text>`; }).join('');
  const dots = pts.map((p, i) => {
    const its = items[p.d]; if (!its || !i && !its.length) return '';
    const net = its.reduce((s, o) => s + planEffect(o.p, acc), 0); if (!net) return '';
    return `<circle cx="${x(i)}" cy="${yv(p.b)}" r="3.2" fill="${net > 0 ? 'var(--green)' : 'var(--orange)'}"/>`;
  }).join('');
  return `<svg class="chart cf-chart" id="cfChart" viewBox="0 0 ${W} ${H}">
    <path d="${area}" fill="var(--accent)" opacity=".08"/>
    <line x1="${L}" x2="${W - R}" y1="${yv(0)}" y2="${yv(0)}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>
    <text x="${W - R}" y="${yv(0) - 4}" text-anchor="end">0 €</text>
    ${acc === 'tekuci' && od ? `<line x1="${L}" x2="${W - R}" y1="${yv(-od)}" y2="${yv(-od)}" stroke="var(--orange)" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="${W - R}" y="${yv(-od) - 4}" text-anchor="end" style="fill:var(--orange)">limit minusa</text>` : ''}
    ${base ? `<path d="${line(base)}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="3 3"/>` : ''}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
    ${dots}
    <line id="cfCross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" opacity="0"/>
    <circle id="cfDot" r="5.5" fill="var(--ink)" opacity="0"/>
    ${tickSvg}
  </svg>`;
}
function cfDayInfo(p, items, acc) {
  const its = items[p.d] || [];
  return `<div class="cf-day-head"><b>${niceDate(p.d)}</b><span class="${p.b < 0 ? 'neg' : ''}">${MS(p.b)}</span></div>
    ${its.length ? its.map(o => { const e = planEffect(o.p, acc); return `<div class="cf-li"><span>${esc(o.p.note || txCat(o.p.cat).name)}${o.late ? ' <i>(čeka potvrdu)</i>' : ''}</span><b class="${e > 0 ? 'in' : ''}">${e > 0 ? '+' : '−'}${M(Math.abs(e))}</b></div>`; }).join('') : '<div class="note" style="margin:4px 0 0">Nema planiranih stavki taj dan.</div>'}`;
}

function finDebts(bTek, tek) {

  const pct = totalOrig ? Math.round((totalOrig - totalBal) / totalOrig * 100) : 0;
  const maxMonths = Math.max(0, ...list.map(d => debtPayoff(d).months).filter(n => isFinite(n)));
  const card = (d, rank) => {

    </div>
    <div class="card">
      <div class="top" style="display:flex;justify-content:space-between;align-items:baseline"><span class="section-title" style="font-size:21px">Dozvoljeni minus</span><span class="kicker" style="color:var(--muted)">tekući</span></div>

    <button class="btn" id="f-ok">Uplati ekstra</button>`);
  document.getElementById('f-ok').onclick = () => {

    d.balance = Math.max(0, Math.round((d.balance - a) * 100) / 100);
    d.fund.saved = Math.max(0, Math.round((sv - a) * 100) / 100);

}

function finSavings(bSted) {
  const allocated = state.goals.reduce((s, g) => s + (g.saved || 0), 0) + state.debts.reduce((s, d) => s + (d.fund ? d.fund.saved || 0 : 0), 0);
  const free = bSted - allocated;
  const card = g => {
    const pct = g.target ? Math.min(100, Math.round((g.saved || 0) / g.target * 100)) : 0;
    let need = '';
    if (g.deadline && g.saved < g.target) { const months = Math.max(1, Math.round(daysUntil(g.deadline) / 30.4)); need = `· ${M((g.target - g.saved) / months)} mjesečno do ${shortDate(g.deadline)}`; }
    return `<div class="debt" data-goal="${g.id}">
      <div class="top"><span class="nm">${esc(g.emoji || '🎯')} ${esc(g.name)}</span><span class="rk">${pct} %</span></div>
      <div class="progress"><span style="width:${pct}%;background:var(--accent)"></span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px">
        <div class="note" style="margin:0">${M(g.saved || 0)} od ${M(g.target)} ${need}</div>
        ${pct < 100 ? `<button class="mini-btn" data-add="1">Dodaj</button>` : '<span>🎉</span>'}
      </div></div>`;
  };
  return `
    <div class="card summary">
      <div class="stat"><div class="k">Na štednom</div><div class="v">${MS(bSted)}</div></div>
      <div class="stat"><div class="k">Slobodno</div><div class="v" style="color:${free < 0 ? 'var(--orange)' : 'inherit'}">${MS(free)}</div></div>
    </div>
    ${free < 0 && ui.reveal ? `<div class="warn">Ciljevima je dodijeljeno više nego što imaš na štednom.</div>` : ''}
    ${state.debts.some(d => d.fund && d.balance > 0) ? `<div class="sec-head"><span class="section-title">Fondovi za kredite</span></div>
    <div class="card tight">${state.debts.filter(d => d.fund && d.balance > 0).map(d => `<div class="debt" data-debt="${d.id}"><div class="top"><span class="nm">${esc(d.name)}</span></div>${fundHtml(d)}</div>`).join('')}</div>` : ''}
    <div class="sec-head"><span class="section-title">Ciljevi štednje</span><button class="link-btn" id="goalAdd">+ Dodaj</button></div>
    <div class="card tight">${state.goals.length ? state.goals.map(card).join('') : emptyArt('', 'prvi cilj?', 'Putovanje, selidba, novi laptop… dodaj na + Dodaj')}</div>
    ${wishSection()}`;
}

/* ===================== LISTA ŽELJA (pravilo 30 dana) ===================== */
const WISH_DAYS = 30;
function nextIncomeDate() {
  const up = upcomingPlanned(45).find(o => o.p.type === 'in' && (o.p.acc || 'tekuci') === 'tekuci');
  return up ? up.d : null;
}
function affordCheck(price) {
  const tek = accById('tekuci');
  const pay = nextIncomeDate();
  const horizon = pay ? Math.max(1, daysUntil(pay) - 1) : 30;
  const pts = projection('tekuci', horizon);
  const low = Math.min(...pts.map(p => p.b));
  const after = low - price;
  const od = tek.overdraft || 0;
  const free = accBalance('stedni') - state.goals.reduce((s, g) => s + (g.saved || 0), 0) - state.debts.reduce((s, d) => s + (d.fund ? d.fund.saved || 0 : 0), 0);
  let level, text;
  if (after >= 0) { level = 'ok'; text = 'Možeš bez minusa'; }
  else if (after >= -od) { level = 'warn'; text = 'Ušla bi u minus'; }
  else { level = 'no'; text = 'Prelazi dozvoljeni minus'; }
  return { level, text, after, low, pay, free, fromSavings: free >= price };
}
function wishHtml(w) {
  const age = daysUntil(w.added) * -1;
  const left = Math.max(0, WISH_DAYS - age);
  const pct = Math.min(100, Math.round(age / WISH_DAYS * 100));
  const a = affordCheck(w.price);
  const col = a.level === 'ok' ? 'var(--green)' : a.level === 'warn' ? 'var(--orange)' : '#d33';
  return `<div class="debt wish" data-wish="${w.id}">
    <div class="top"><span class="nm">${esc(w.name)}</span><span class="rk">${w.need ? 'treba mi' : 'želim'}</span></div>
    <div class="wish-row"><b>${M(w.price)}</b>${w.link ? ` · <a href="${esc(w.link)}" target="_blank" rel="noopener" class="wish-link">link</a>` : ''}</div>
    <div class="progress"><span style="width:${pct}%;background:${left ? 'var(--blue)' : 'var(--green)'}"></span></div>
    <div class="note" style="margin:6px 0 0">${left ? `⏳ Još <b style="color:var(--ink)">${left} ${plural(left, 'dan', 'dana', 'dana')}</b> razmišljanja` : '✓ Prošlo je 30 dana. <b style="color:var(--ink)">Još ga želiš?</b>'}</div>
    <div class="afford" style="border-color:${col}">
      <span class="dotc" style="background:${col}"></span>
      <div><b>${a.text}</b><br><span>${ui.reveal ? `Najniže stanje tekućeg${a.pay ? ` do plaće (${shortDate(a.pay)})` : ' idućih 30 dana'} nakon kupnje: <b>${MS(a.after)}</b>${a.fromSavings ? ` · ili sa štednog (slobodno ${M(a.free)})` : ''}` : 'Dodirni oko gore za iznose'}</span></div>
    </div>
    <div class="fund-btns">
      <button class="mini-btn" data-wno="1">Ne treba mi</button>
      <button class="mini-btn" data-wgoal="1">Štedi za to</button>
      <button class="mini-btn ${!left ? 'hot' : ''}" data-wbuy="1">Kupila sam</button>
    </div>
  </div>`;
}
function wishSection() {
  const list = (state.wishes || []).slice().sort((a, b) => a.added.localeCompare(b.added));
  const saved = state.settings.wishSaved || 0;
  return `<div class="sec-head"><span class="section-title">Lista želja</span><button class="link-btn" id="wishAdd">+ Dodaj</button></div>
    <div class="note" style="margin:-4px 0 10px">Pravilo 30 dana: upiši što želiš kupiti i pričekaj. Ako i nakon mjesec dana želiš, a novca ima – kupi s mirom.${saved ? ` <b style="color:var(--ink)">Ušteđeno odustajanjem: ${M(saved)}</b>` : ''}</div>
    <div class="card tight">${list.length ? list.map(wishHtml).join('') : emptyArt('', 'lista je prazna', 'Monitor, jakna, koncert… dodaj na + Dodaj')}</div>`;
}
function openWishSheet(existing) {
  const w = existing || { name: '', price: '', need: false, link: '' };
  openSheet(existing ? 'Uredi želju' : 'Nova želja', `
    <div class="field"><label>Što želiš?</label><input id="f-name" value="${esc(w.name)}" placeholder="npr. Monitor" autocomplete="off"></div>
    <div class="field"><label>Cijena (€)</label><input id="f-price" inputmode="decimal" value="${w.price === '' ? '' : String(w.price).replace('.', ',')}" style="font-size:24px;font-weight:800" placeholder="0,00"></div>
    <div class="seg" id="f-need"><button data-n="0" class="${w.need ? '' : 'on'}">Samo želim</button><button data-n="1" class="${w.need ? 'on' : ''}">Treba mi (faks/posao)</button></div>
    <div class="field"><label>Link (neobavezno)</label><input id="f-link" value="${esc(w.link || '')}" placeholder="https://…" autocomplete="off" inputmode="url"></div>

  if (!existing) setTimeout(() => document.getElementById('f-name').focus(), 280);
  document.getElementById('f-save').onclick = () => {

    let link = document.getElementById('f-link').value.trim(); if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    const data = { name, price, need, link };
    state.wishes ||= [];
    if (existing) Object.assign(existing, data); else state.wishes.push({ id: uid(), added: todayStr(), ...data });
    save(); closeSheet(); render(); toast(existing ? 'Spremljeno' : '⏳ Dodano – javim se za 30 dana');
  };
  if (existing) document.getElementById('f-del').onclick = () => { state.wishes = state.wishes.filter(x => x.id !== existing.id); save(); closeSheet(); render(); };

function bindWishes() {
  const add = document.getElementById('wishAdd'); if (add) add.onclick = () => openWishSheet();
  const gAdd = document.getElementById('goalAdd'); if (gAdd) gAdd.onclick = () => openGoalSheet();
  view.querySelectorAll('[data-wish]').forEach(el => el.onclick = ev => {
    if (ev.target.closest('a')) return;
    const w = (state.wishes || []).find(x => x.id === el.dataset.wish); if (!w) return;
    if (ev.target.closest('[data-wno]')) {
      state.wishes = state.wishes.filter(x => x.id !== w.id);
      state.settings.wishSaved = Math.round(((state.settings.wishSaved || 0) + w.price) * 100) / 100;
      save(); render(); toast(`Odlično! ${money(w.price)} ostaje kod tebe 💪`);
    } else if (ev.target.closest('[data-wgoal]')) {
      state.goals.push({ id: uid(), name: w.name, emoji: '🛍️', target: w.price, saved: 0, deadline: '' });
      state.wishes = state.wishes.filter(x => x.id !== w.id);
      save(); render(); toast('Cilj štednje napravljen 🎯');
    } else if (ev.target.closest('[data-wbuy]')) {
      const left = Math.max(0, WISH_DAYS + daysUntil(w.added));
      if (left && !confirm(`Još ${left} dana do kraja pravila 30 dana. Ipak kupuješ?`)) return;
      openSheet(`Kupnja: ${w.name}`, `
        <div class="field"><label>Plaćeno (€)</label><input id="f-amount" inputmode="decimal" value="${String(w.price).replace('.', ',')}" style="font-size:24px;font-weight:800"></div>

        <button class="btn" id="f-ok">Zabilježi kupnju</button>`);
      let acc = 'tekuci'; bindAccChips('f-acc', v => acc = v);
      document.getElementById('f-ok').onclick = () => {
        const a = parseAmount(document.getElementById('f-amount').value); if (!(a > 0)) return toast('Upiši iznos');
        state.tx.push({ id: uid(), created: Date.now(), type: 'out', amount: a, cat: 'kupovina', acc, date: todayStr(), note: w.name });
        state.wishes = state.wishes.filter(x => x.id !== w.id);
        save(); closeSheet(); render(); toast('Uživaj u novoj stvari 🛍️');
      };
    } else openWishSheet(w);
  });
}

function accChips(id, cur) { return `<div class="chips" id="${id}">${state.accounts.map(a => `<button class="chip ${a.id === cur ? 'on' : ''}" data-acc="${a.id}">${a.name}</button>`).join('')}</div>`; }
function bindAccChips(id, cb) {
  document.getElementById(id).onclick = ev => { const b = ev.target.closest('[data-acc]'); if (!b) return; cb(b.dataset.acc); document.querySelectorAll(`#${id} .chip`).forEach(x => x.classList.toggle('on', x === b)); };
}

const FAKS_SEED = [
  [1, 'Matematika I', '', 'polozen'], [1, 'Uvod u informacijsko-komunikacijske tehnologije', '', 'polozen'], [1, 'Osnove programiranja', 'prof. Cerinski', 'nepolozen'],

  [3, 'Web programiranje', 'izv. prof. Matija Varga', 'nije', { nastava: '11.–30. 1. 2027.' }],

  [6, 'Upravljanje rizicima', '', 'nije'], [6, 'Završni rad', '', 'nije']
];
const SUBJ_ALIAS = { asp: 'strukture podataka i algoritmi', spa: 'strukture podataka i algoritmi', 'algoritmi i strukture podataka': 'strukture podataka i algoritmi', os: 'operacijski sustavi', pris: 'projektiranje informacijskih sustava', pis: 'projektiranje informacijskih sustava', ksm: 'komunikacijski sustavi i mreže', 'programiranje': 'osnove programiranja', oop: 'objektno programiranje' };
function normName(n) { return (n || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim(); }
function tokKey(n) { return normName(n).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').split(/[^a-z0-9]+/).filter(w => w && !['i', 'u', 'za', 'od'].includes(w)).sort().join(' '); }
function faksMigrate(s) {
  s.faksTasks ||= [];
  if (s.faksSeeded) return;
  const subs = s.subjects;
  FAKS_SEED.forEach(([sem, name, prof, status, extra], i) => {
    const k = tokKey(name);
    let ex = subs.find(x => !x._m && (tokKey(x.name) === k || tokKey(SUBJ_ALIAS[normName(x.name)] || '') === k));
    if (ex) {
      ex._m = true;
      ex.sem ??= sem; ex.prof ||= prof; ex.status ||= status;
      if (extra) { if (extra.grade && !ex.grade) ex.grade = extra.grade; if (extra.nastava && !ex.nastava) ex.nastava = extra.nastava; if (extra.notes && !(ex.notes || '').includes(extra.notes)) ex.notes = ((ex.notes || '') + (ex.notes ? '\n' : '') + extra.notes); }
    } else subs.push({ id: uid(), name, color: PALETTE[(subs.length) % PALETTE.length], notes: (extra && extra.notes) || '', sem, prof, status, grade: (extra && extra.grade) || null, nastava: (extra && extra.nastava) || '', ects: null, points: [], links: [], _m: true });
  });
  subs.forEach(x => { delete x._m; x.points ||= []; x.links ||= []; x.status ||= 'nije'; if (x.sem === undefined) x.sem = null; });
  const by = n => subs.find(x => tokKey(x.name) === tokKey(n));
  const add = (n, t) => { const sj = by(n); if (sj && !s.faksTasks.some(x => normName(x.title) === normName(t.title))) s.faksTasks.push({ id: uid(), subjectId: sj.id, created: Date.now(), remind: [3, 1], max: null, got: null, note: '', date: '', time: '', due: '', dueTime: '', status: 'todo', ...t }); };
  add('Komunikacijski sustavi i mreže', { type: 'prakticni', title: 'Praktični rad 2 (Packet Tracer)', due: '2026-11-28', dueTime: '12:00', status: 'predano' });
  add('Komunikacijski sustavi i mreže', { type: 'pismeni', title: 'Pismeni ispit / predrok', note: 'Vjerojatno sredina prosinca – upiši datum kad bude poznat.' });
  add('Osnove menadžmenta', { type: 'rok', title: 'Idući rok: pismeni + usmeni', note: 'Za usmeni treba eksterna USB kamera + mobitel.' });
  add('Osnove programiranja', { type: 'predrok', title: 'Predrok (siječanj)', note: 'Upiši točan datum kad bude objavljen.' });
  s.faksSeeded = true;
}
function faksStats() {
  const subs = state.subjects.filter(s => s.sem);
  const passed = subs.filter(s => s.status === 'polozen');
  const graded = passed.filter(s => s.grade >= 2);
  const avg = graded.length ? graded.reduce((a, s) => a + s.grade, 0) / graded.length : null;
  const ects = passed.reduce((a, s) => a + (+s.ects || 0), 0);
  return { total: subs.length, passed: passed.length, avg, ects, graded: graded.length };
}
function currentSem() { const sems = state.subjects.filter(s => s.sem && (s.status === 'tijek' || s.status === 'ceka')).map(s => s.sem); return sems.length ? Math.max(...sems) : 3; }
function taskRow(t, showSubj) {
  const sj = subjectById(t.subjectId), k = taskKey(t), ty = tType(t.type), st = tStat(t.status);

    <span class="ft-side">${cd}<em style="color:${st[2]}">${st[1]}</em></span></button>`;

function taskIcs(t) {

  else { const nx = addDays(k, 1).replace(/-/g, ''); start = `DTSTART;VALUE=DATE:${dt}`; end = `DTEND;VALUE=DATE:${nx}`; }
