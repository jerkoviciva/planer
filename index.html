<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Planer</title>
<style>
  :root {
    --bg: #0d0c12;
    --surface: #17151f;
    --surface-2: #221f2c;
    --line: rgba(255,255,255,.07);
    --text: #f5f2f9;
    --muted: #9b94a9;
    --accent: #ff9e86;
    --grad: linear-gradient(135deg, #ff8fa3 0%, #ffb37a 100%);
    --c-cal: #b79cff;
    --c-fin: #5eead4;
    --c-faks: #7cc4ff;
    --c-proj: #ffb37a;
    --green: #5eead4;
    --red: #ff7b8a;
    --radius: 20px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.4; min-height: 100vh;
    background:
      radial-gradient(120% 60% at 100% -10%, rgba(255,143,163,.16), transparent 60%),
      radial-gradient(90% 50% at -10% 0%, rgba(183,156,255,.14), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, select, textarea { font: inherit; font-size: 16px; color: var(--text); }
  svg { display: block; }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 5; padding: calc(var(--safe-top) + 14px) 20px 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: rgba(13,12,18,.72); }
  .hrow { display: flex; align-items: center; gap: 12px; max-width: 560px; margin: 0 auto; }
  .htext { flex: 1; min-width: 0; }
  header.top h1 { margin: 0; font-size: 28px; font-weight: 750; letter-spacing: -.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top .sub { color: var(--muted); font-size: 13px; font-weight: 500; }
  .hidden { display: none !important; }

  main { padding: 4px 16px calc(var(--safe-bottom) + 120px); max-width: 560px; margin: 0 auto; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card.tight { padding: 4px 14px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 10px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
  .link-btn { color: var(--accent); font-weight: 650; font-size: 14px; }

  .icon-btn { width: 40px; height: 40px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
  .pill-btn { padding: 7px 13px; border-radius: 999px; background: rgba(255,158,134,.14); color: var(--accent); font-size: 13px; font-weight: 650; }

  /* Home */
  .today-card { background: linear-gradient(160deg, rgba(255,143,163,.16), rgba(255,179,122,.06) 60%, transparent), var(--surface); }
  .today-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .today-head b { font-size: 17px; }
  .today-head span { color: var(--muted); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { text-align: left; border-radius: 22px; padding: 16px; min-height: 148px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); position: relative; overflow: hidden; }
  .tile .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: #0d0c12; }
  .tile .name { font-weight: 700; font-size: 17px; margin-top: 14px; }
  .tile .info { color: var(--muted); font-size: 13px; margin-top: 2px; line-height: 1.3; }
  .tile .info b { color: var(--text); font-weight: 650; }
  .tile::after { content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%; right: -40px; top: -40px; background: var(--glow); filter: blur(30px); opacity: .55; }
  .quick { display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 0 16px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }

  /* Calendar */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .month-nav .label { font-weight: 700; font-size: 17px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal .wd { font-size: 11px; color: var(--muted); padding: 4px 0 6px; font-weight: 650; }
  .cal .day { aspect-ratio: 1 / 1.05; border-radius: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 15px; }
  .cal .day.other { color: #4b4558; }
  .cal .day.today .n { color: var(--accent); font-weight: 800; }
  .cal .day.sel { background: var(--grad); color: #0d0c12; }
  .cal .day.sel .n { color: #0d0c12; font-weight: 800; }
  .dots { display: flex; gap: 3px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
  .cal .day.sel .dots i { background: #0d0c12 !important; }

  /* Lists */
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .title.wrap { white-space: pre-wrap; overflow: visible; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item.done .title { text-decoration: line-through; color: var(--muted); }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #3a3546; flex: none; display: grid; place-items: center; color: #0d0c12; }
  .check.on { border-color: transparent; background: var(--grad); }
  .bar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: 14px; }
  .amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amount.in { color: var(--green); }
  .cat-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex: none; }
  .date-head { font-size: 12px; color: var(--muted); padding: 12px 2px 0; font-weight: 650; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; flex: none; }

  /* Budget */
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .summary .big { grid-column: 1 / -1; }
  .stat .k { color: var(--muted); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 21px; font-weight: 750; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat.big .v { font-size: 36px; letter-spacing: -.03em; }
  .fin-hero { background: linear-gradient(160deg, rgba(94,234,212,.16), rgba(94,234,212,.03) 60%, transparent), var(--surface); }
  .progress { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; margin-top: 7px; }
  .progress > span { display: block; height: 100%; border-radius: 8px; }
  .progress > span.over { background: var(--red) !important; }
  .cat-row { padding: 10px 0; }
  .cat-row .line { display: flex; justify-content: space-between; gap: 10px; }
  .cat-row .line .r { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* Subjects / projects */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .scard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; position: relative; overflow: hidden; min-height: 96px; }
  .scard .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .scard .nm { font-weight: 700; font-size: 16px; }
  .scard .mt { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .pcard { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin-bottom: 12px; }
  .emoji { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; flex: none; }
  .pcard .nm { font-weight: 700; font-size: 16px; }
  .pcard .st { color: #cfc8db; font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pcard .mt { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .status-card { text-align: left; width: 100%; display: block; }
  .status-card .txt { white-space: pre-wrap; font-size: 15px; margin-top: 6px; }
  .status-card .ph { color: var(--muted); }
  .notes-area { width: 100%; min-height: 220px; background: transparent; border: 0; outline: none; resize: vertical; line-height: 1.5; }
  .log { padding: 12px 2px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; display: block; }
  .log:last-child { border-bottom: 0; }
  .log .d { color: var(--muted); font-size: 12px; font-weight: 650; }
  .log .t { white-space: pre-wrap; margin-top: 3px; }

  /* Tab bar */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: space-around; padding: 8px 6px calc(var(--safe-bottom) + 8px); background: rgba(19,17,26,.88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
  nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 650; padding: 4px 0; }
  nav.tabs button.on { color: var(--text); }
  nav.tabs button .ic { width: 44px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
  nav.tabs button.on .ic { background: rgba(255,158,134,.18); color: var(--accent); }

  .fab { position: fixed; right: 20px; bottom: calc(var(--safe-bottom) + 84px); z-index: 11; width: 58px; height: 58px; border-radius: 20px; background: var(--grad); color: #0d0c12; display: grid; place-items: center; box-shadow: 0 10px 28px rgba(255,143,163,.35); }

  /* Sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; padding: 10px 18px calc(var(--safe-bottom) + 18px); max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.3,1); max-width: 560px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 5px; border-radius: 5px; background: #3a3546; margin: 0 auto 12px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 19px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 650; margin: 0 0 6px 2px; text-transform: uppercase; letter-spacing: .06em; }
  .field input, .field select, .field textarea { width: 100%; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 13px; outline: none; -webkit-appearance: none; appearance: none; }
  .field textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 14px; padding: 3px; margin-bottom: 14px; border: 1px solid var(--line); }
  .seg button { padding: 9px; border-radius: 11px; font-weight: 650; color: var(--muted); font-size: 14px; }
  .seg button.on { background: var(--bg); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
  .chip.on { border-color: var(--accent); background: rgba(255,158,134,.14); color: var(--accent); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
  .swatches button.on { border-color: var(--text); }
  .btn { width: 100%; padding: 15px; border-radius: 15px; background: var(--grad); color: #0d0c12; font-weight: 750; font-size: 16px; margin-top: 6px; }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--red); }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .settings-row input { width: 120px; padding: 9px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; text-align: right; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 160px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 650; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .fade { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="hrow">
    <button class="icon-btn hidden" id="back" aria-label="Natrag"></button>
    <div class="htext"><div class="sub" id="subtitle"></div><h1 id="title">Planer</h1></div>
    <button class="icon-btn hidden" id="hbtn"></button>
  </div>
</header>

<main id="view"></main>

<button class="fab" id="fab" aria-label="Dodaj"></button>

<nav class="tabs" id="tabs"></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== Ikone ===================== */
const PATHS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  fin: '<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
  faks: '<path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
  proj: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  gear: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  left: '<path d="M15 18l-6-6 6-6"/>',
  right: '<path d="M9 18l6-6-6-6"/>',
};
const icon = (n, s = 22, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${PATHS[n]}</svg>`;

/* ===================== Podaci ===================== */
const STORAGE_KEY = 'planer-data-v1';
const NAME = 'Iva';

const EVENT_CATS = [
  { id: 'posao',    name: 'Posao',    color: '#ffd166' },
  { id: 'faks',     name: 'Faks',     color: '#7cc4ff' },
  { id: 'projekti', name: 'Projekti', color: '#ffb37a' },
  { id: 'osobno',   name: 'Osobno',   color: '#b79cff' },
  { id: 'ostalo',   name: 'Ostalo',   color: '#9b94a9' },
];
const EXPENSE_CATS = [
  { id: 'stan',      name: 'Stan i režije', ico: '🏠', color: '#b79cff' },
  { id: 'hrana',     name: 'Hrana',         ico: '🛒', color: '#5eead4' },
  { id: 'prijevoz',  name: 'Prijevoz',      ico: '🚗', color: '#7cc4ff' },
  { id: 'faks',      name: 'Faks',          ico: '🎓', color: '#a5b4fc' },
  { id: 'izlasci',   name: 'Izlasci',       ico: '🍸', color: '#ff8fa3' },
  { id: 'kupovina',  name: 'Kupovina',      ico: '🛍️', color: '#ffb37a' },
  { id: 'pretplate', name: 'Pretplate',     ico: '🔁', color: '#fde68a' },
  { id: 'ostalo',    name: 'Ostalo',        ico: '📦', color: '#9b94a9' },
];
const INCOME_CATS = [
  { id: 'placa',     name: 'Plaća',     ico: '💼', color: '#5eead4' },
  { id: 'freelance', name: 'Freelance', ico: '💻', color: '#5eead4' },
  { id: 'ostalo-in', name: 'Ostalo',    ico: '✨', color: '#5eead4' },
];
const PALETTE = ['#ff8fa3', '#ffb37a', '#fde68a', '#5eead4', '#7cc4ff', '#b79cff', '#f0abfc', '#9b94a9'];

function emptyState() { return { version: 2, events: [], tx: [], budgets: {}, subjects: [], projects: [], inbox: [] }; }
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyState();
    return Object.assign(emptyState(), JSON.parse(raw), { version: 2 });
  } catch (e) { return emptyState(); }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { toast('Spremanje nije uspjelo'); }
}
let state = load();

/* ===================== Pomoćne ===================== */
const MONTHS = ['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];
const MONTHS_GEN = ['siječnja','veljače','ožujka','travnja','svibnja','lipnja','srpnja','kolovoza','rujna','listopada','studenoga','prosinca'];
const MONTHS_LOC = ['siječnju','veljači','ožujku','travnju','svibnju','lipnju','srpnju','kolovozu','rujnu','listopadu','studenom','prosincu'];
const DAYS = ['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'];
const WD_SHORT = ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'];

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = new Intl.NumberFormat('hr-HR', { style: 'currency', currency: 'EUR' });
const money = n => eur.format(n || 0);
const parseAmount = s => { const n = parseFloat(String(s).replace(/\s/g,'').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const shortDate = s => { const d = parseYmd(s); return `${d.getDate()}. ${MONTHS_GEN[d.getMonth()]}`; };
const fullDate = s => { const d = parseYmd(s); return `${cap(DAYS[d.getDay()])}, ${shortDate(s)}`; };
function niceDate(s) {
  const t = new Date(); const tm = new Date(); tm.setDate(t.getDate() + 1); const yd = new Date(); yd.setDate(t.getDate() - 1);
  if (s === ymd(t)) return `Danas, ${shortDate(s)}`;
  if (s === ymd(tm)) return `Sutra, ${shortDate(s)}`;
  if (s === ymd(yd)) return `Jučer, ${shortDate(s)}`;
  return fullDate(s);
}
function daysUntil(s) { const a = parseYmd(todayStr()), b = parseYmd(s); return Math.round((b - a) / 86400000); }
function countdown(s) {
  const n = daysUntil(s);
  if (n < 0) return 'prošlo';
  if (n === 0) return 'danas';
  if (n === 1) return 'sutra';
  return `za ${n} ${n % 10 === 1 && n % 100 !== 11 ? 'dan' : 'dana'}`;
}
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Dobro jutro' : h < 18 ? 'Bok' : 'Dobra večer'; }

const evCat = id => EVENT_CATS.find(c => c.id === id) || EVENT_CATS[4];
const txCat = id => [...EXPENSE_CATS, ...INCOME_CATS].find(c => c.id === id) || EXPENSE_CATS[7];
const subjectById = id => state.subjects.find(s => s.id === id);
const projectById = id => state.projects.find(p => p.id === id);

function toast(msg) {

}

/* ===================== POČETNA ===================== */
function monthTotals(y, m) {
  const prefix = `${y}-${pad(m+1)}`;
  const txs = state.tx.filter(t => t.date.startsWith(prefix));
  const income = txs.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
  const spent = txs.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
  return { txs, income, spent, left: income - spent };
}

function renderHome() {
  const today = todayStr();
  setHeader(`${greeting()}, ${NAME}`, fullDate(today), { btn: { ico: 'gear', label: 'Postavke', onclick: () => go('postavke') } });

  const todays = state.events.filter(e => e.date === today).sort(sortEvents);
  const left = todays.filter(e => !e.done).length;

  const wk = new Date(); wk.setDate(wk.getDate() + 7);
  const weekCount = state.events.filter(e => e.date >= today && e.date <= ymd(wk) && !e.done).length;
  const { left: moneyLeft } = monthTotals(now.getFullYear(), now.getMonth());
  const nextFaks = state.events.filter(e => e.cat === 'faks' && e.date >= today && !e.done).sort((a, b) => a.date.localeCompare(b.date) || sortEvents(a, b))[0];
  const activeProj = state.projects.filter(p => !p.archived);

  const tile = (id, name, color, ico, info) => `

      <div><div class="name">${name}</div><div class="info">${info}</div></div>
    </button>`;

  const faksInfo = nextFaks
    ? `<b>${esc(eventLabel(nextFaks))}</b><br>${countdown(nextFaks.date)}`

  view.innerHTML = `
    <div class="card today-card">
      <div class="today-head"><b>Danas</b><span>${todays.length ? (left ? `još ${left} od ${todays.length}` : 'sve gotovo 🎉') : ''}</span></div>
      ${todays.length ? todays.map(e => eventRow(e)).join('') : `<div class="empty" style="padding:10px 0 4px;text-align:left">Danas nemaš ništa upisano. Uživaj ✨</div>`}
    </div>

    <div class="tiles">
      ${tile('kalendar', 'Kalendar', '#b79cff', 'cal', weekCount ? `<b>${weekCount}</b> obaveza idućih 7 dana` : 'Tjedan je prazan')}
      ${tile('financije', 'Financije', '#5eead4', 'fin', `<b>${money(moneyLeft)}</b><br>ostaje u ${MONTHS_LOC[now.getMonth()]}`)}
      ${tile('faks', 'Faks', '#7cc4ff', 'faks', faksInfo)}
      ${tile('projekti', 'Projekti', '#ffb37a', 'proj', activeProj.length ? `<b>${activeProj.length}</b> u tijeku` : 'Dodaj prvi projekt')}
    </div>

    <div class="quick">
      <button id="q-ev">${icon('cal', 16)} Obaveza</button>
      <button id="q-tx">${icon('fin', 16)} Trošak</button>
      <button id="q-idea">${icon('bulb', 16)} Ideja</button>
    </div>

    ${activeProj.length ? `
      <div class="sec-head"><span class="section-title">Na čemu sam</span><button class="link-btn" data-go="projekti">Svi</button></div>

  view.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  view.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => { ui.tab = 'projekti'; ui.project = b.dataset.pid; ui.projSeg = 'dnevnik'; window.scrollTo(0, 0); render(); });
  bindEventRows();
  document.getElementById('q-ev').onclick = () => openEventSheet(null, { date: today });
  document.getElementById('q-tx').onclick = () => openTxSheet();
  document.getElementById('q-idea').onclick = () => openIdeaSheet();
}

/* ===================== KALENDAR ===================== */
function renderPlanner() {
  setHeader('Kalendar', fullDate(todayStr()));
  const { calY: y, calM: m } = ui;
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - offset);
  const today = todayStr();

  const byDate = {};
  for (const e of state.events) (byDate[e.date] ||= []).push(e);

  let cells = WD_SHORT.map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i === 35 && d.getMonth() !== m) break;
    const s = ymd(d);
    const evs = byDate[s] || [];
    const dots = [...new Set(evs.map(eventColor))].slice(0, 3).map(c => `<i style="background:${c}"></i>`).join('');
    const cls = ['day', d.getMonth() !== m && 'other', s === today && 'today', s === ui.sel && 'sel'].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-date="${s}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }

  const dayEvents = (byDate[ui.sel] || []).slice().sort(sortEvents);
  const limit = new Date(); limit.setDate(limit.getDate() + 7);
  const upcoming = state.events
    .filter(e => e.date >= today && e.date <= ymd(limit) && e.date !== ui.sel && !e.done)
    .sort((a, b) => a.date.localeCompare(b.date) || sortEvents(a, b)).slice(0, 8);

  view.innerHTML = `
    <div class="card">
      <div class="month-nav">
        <button class="icon-btn" id="prevM" aria-label="Prethodni mjesec">${icon('left', 20)}</button>
        <div class="label">${MONTHS[m]} ${y}</div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="pill-btn" id="goToday">Danas</button>
          <button class="icon-btn" id="nextM" aria-label="Sljedeći mjesec">${icon('right', 20)}</button>
        </div>
      </div>
      <div class="cal" id="cal">${cells}</div>
    </div>

    <div class="sec-head"><span class="section-title">${niceDate(ui.sel)}</span></div>
    <div class="card tight">
      ${dayEvents.length ? dayEvents.map(e => eventRow(e)).join('') : `<div class="empty">Nema obaveza za ovaj dan.</div>`}
    </div>

    ${upcoming.length ? `
      <div class="sec-head"><span class="section-title">Idućih 7 dana</span></div>
      <div class="card tight">${upcoming.map(e => eventRow(e, true)).join('')}</div>` : ''}
  `;

  document.getElementById('prevM').onclick = () => shiftCal(-1);
  document.getElementById('nextM').onclick = () => shiftCal(1);
  document.getElementById('goToday').onclick = () => { const n = new Date(); ui.calY = n.getFullYear(); ui.calM = n.getMonth(); ui.sel = todayStr(); render(); };
  document.getElementById('cal').onclick = ev => {
    const b = ev.target.closest('[data-date]'); if (!b) return;
    ui.sel = b.dataset.date; const d = parseYmd(ui.sel); ui.calY = d.getFullYear(); ui.calM = d.getMonth(); render();
  };
  bindEventRows();
}
function shiftCal(d) { ui.calM += d; if (ui.calM < 0) { ui.calM = 11; ui.calY--; } if (ui.calM > 11) { ui.calM = 0; ui.calY++; } render(); }
function sortEvents(a, b) { if (!!a.done !== !!b.done) return a.done ? 1 : -1; return (a.time || '99:99').localeCompare(b.time || '99:99'); }
function eventColor(e) { const s = e.subjectId && subjectById(e.subjectId); return s ? s.color : evCat(e.cat).color; }
function eventLabel(e) { const s = e.subjectId && subjectById(e.subjectId); return s ? `${s.name}: ${e.title}` : e.title; }
function eventRow(e, showDate, showCountdown) {
  const s = e.subjectId && subjectById(e.subjectId);
  const meta = [showDate ? niceDate(e.date) : null, e.time || (showDate ? null : 'Cijeli dan'), s ? s.name : evCat(e.cat).name].filter(Boolean).join(' · ');
  const color = eventColor(e);
  const badge = showCountdown && !e.done ? `<span class="badge" style="background:${hexA(color,.16)};color:${color}">${countdown(e.date)}</span>` : '';
  return `<div class="item ${e.done ? 'done' : ''}" data-ev="${e.id}">
    <span class="check ${e.done ? 'on' : ''}">${e.done ? icon('check', 14, 3) : ''}</span>
    <span class="bar" style="background:${color}"></span>
    <div class="main"><div class="title">${esc(e.title)}</div><div class="meta">${esc(meta)}${e.note ? ' · ' + esc(e.note) : ''}</div></div>
    ${badge}
  </div>`;
}
function bindEventRows() {
  view.querySelectorAll('[data-ev]').forEach(el => {
    el.onclick = ev => {
      const e = state.events.find(x => x.id === el.dataset.ev); if (!e) return;
      if (ev.target.closest('.check')) { e.done = !e.done; save(); render(); }
      else openEventSheet(e);
    };
  });
}

function openEventSheet(existing, preset = {}) {
  const e = existing || { id: null, date: ui.sel, time: '', title: '', cat: 'osobno', note: '', subjectId: '', ...preset };
  let cat = e.cat;
  const subjOpts = `<option value="">— bez predmeta —</option>` + state.subjects.map(s => `<option value="${s.id}" ${s.id === e.subjectId ? 'selected' : ''}>${esc(s.name)}</option>`).join('');

    </div>

    <div class="field"><label>Bilješka</label><input id="f-note" value="${esc(e.note)}" placeholder="neobavezno" autocomplete="off"></div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  document.getElementById('f-cat').onclick = ev => {
    const b = ev.target.closest('[data-id]'); if (!b) return;
    cat = b.dataset.id;
    document.querySelectorAll('#f-cat .chip').forEach(x => x.classList.toggle('on', x === b));

  };
  if (!existing) setTimeout(() => document.getElementById('f-title').focus(), 280);
  document.getElementById('f-save').onclick = () => {
    const title = document.getElementById('f-title').value.trim();
    const date = document.getElementById('f-date').value;
    if (!title) return toast('Upiši naziv');
    if (!date) return toast('Odaberi datum');
    const data = { title, date, time: document.getElementById('f-time').value, cat, note: document.getElementById('f-note').value.trim(),
      subjectId: cat === 'faks' ? document.getElementById('f-subj').value : '' };
    if (existing) Object.assign(existing, data); else state.events.push({ id: uid(), done: false, ...data });
    save(); closeSheet();
    if (ui.tab === 'kalendar') { ui.sel = date; const d = parseYmd(date); ui.calY = d.getFullYear(); ui.calM = d.getMonth(); }
    render(); toast('Spremljeno');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati ovu obavezu?')) return;
    state.events = state.events.filter(x => x.id !== existing.id); save(); closeSheet(); render(); toast('Obrisano');
  };
}

/* ===================== FINANCIJE ===================== */
function renderBudget() {
  const { budY: y, budM: m } = ui;
  setHeader('Financije', `${MONTHS[m]} ${y}`, { btn: { ico: 'gear', label: 'Limiti', onclick: () => go('postavke') } });
  const { txs, income, spent, left } = monthTotals(y, m);

  const byCat = {};
  for (const t of txs) if (t.type === 'out') byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
  const catRows = EXPENSE_CATS.filter(c => byCat[c.id] || state.budgets[c.id])
    .sort((a, b) => (byCat[b.id] || 0) - (byCat[a.id] || 0))
    .map(c => {
      const s = byCat[c.id] || 0, lim = state.budgets[c.id] || 0;
      const pct = lim ? Math.min(100, s / lim * 100) : (spent ? s / spent * 100 : 0);
      return `<div class="cat-row">
        <div class="line"><span>${c.ico} ${c.name}</span><span class="r">${lim ? `${money(s)} / ${money(lim)}` : money(s)}</span></div>
        <div class="progress"><span class="${lim && s > lim ? 'over' : ''}" style="width:${pct}%;background:${c.color}"></span></div>
        ${lim && s > lim ? `<div class="note" style="color:var(--red);margin:4px 0 0">Prekoračeno za ${money(s - lim)}</div>` : ''}
      </div>`;
    }).join('');
  const totalLimit = Object.values(state.budgets).reduce((s, v) => s + (v || 0), 0);

  const sorted = txs.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
  let list = '', lastDate = '';
  for (const t of sorted) {
    if (t.date !== lastDate) { list += `<div class="date-head">${niceDate(t.date)}</div>`; lastDate = t.date; }
    const c = txCat(t.cat);
    list += `<div class="item" data-tx="${t.id}">
      <span class="cat-ico" style="background:${hexA(c.color,.14)}">${c.ico}</span>
      <div class="main"><div class="title">${esc(t.note || c.name)}</div><div class="meta">${esc(c.name)}</div></div>
      <span class="amount ${t.type === 'in' ? 'in' : ''}">${t.type === 'in' ? '+' : '−'}${money(t.amount)}</span>
    </div>`;
  }

  view.innerHTML = `
    <div class="month-nav" style="padding:0 2px">
      <button class="icon-btn" id="prevB">${icon('left', 20)}</button>
      <div class="label">${MONTHS[m]} ${y}</div>
      <button class="icon-btn" id="nextB">${icon('right', 20)}</button>
    </div>
    <div class="card summary fin-hero">
      <div class="stat big"><div class="k">Ostaje ovaj mjesec</div><div class="v" style="color:${left < 0 ? 'var(--red)' : 'var(--text)'}">${money(left)}</div></div>
      <div class="stat"><div class="k">Prihodi</div><div class="v" style="color:var(--green)">${money(income)}</div></div>
      <div class="stat"><div class="k">Troškovi</div><div class="v">${money(spent)}</div></div>
      ${totalLimit ? `<div class="stat big" style="margin-top:2px">
          <div class="k">Plan potrošnje · ${money(spent)} / ${money(totalLimit)}</div>
          <div class="progress"><span class="${spent > totalLimit ? 'over' : ''}" style="width:${Math.min(100, spent / totalLimit * 100)}%;background:var(--green)"></span></div>
        </div>` : ''}
    </div>
    <div class="sec-head"><span class="section-title">Po kategorijama</span></div>
    <div class="card">
      ${catRows || `<div class="empty">Još nema troškova ovaj mjesec.</div>`}
      ${totalLimit ? '' : `<div class="note">Mjesečne limite postavljaš gumbom gore desno.</div>`}
    </div>
    <div class="sec-head"><span class="section-title">Transakcije</span></div>
    <div class="card tight">${list || `<div class="empty">Dodaj prvi trošak ili prihod na +</div>`}</div>
  `;
  document.getElementById('prevB').onclick = () => shiftBud(-1);
  document.getElementById('nextB').onclick = () => shiftBud(1);
  view.querySelectorAll('[data-tx]').forEach(el => el.onclick = () => { const t = state.tx.find(x => x.id === el.dataset.tx); if (t) openTxSheet(t); });
}
function shiftBud(d) { ui.budM += d; if (ui.budM < 0) { ui.budM = 11; ui.budY--; } if (ui.budM > 11) { ui.budM = 0; ui.budY++; } render(); }

function openTxSheet(existing) {
  const curMonth = `${ui.budY}-${pad(ui.budM+1)}`;
  const defDate = ui.tab !== 'financije' || todayStr().startsWith(curMonth) ? todayStr() : `${curMonth}-01`;

    const b = ev.target.closest('[data-id]'); if (!b) return;

  };

    render(); toast('Spremljeno');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati ovu transakciju?')) return;
    state.tx = state.tx.filter(x => x.id !== existing.id); save(); closeSheet(); render(); toast('Obrisano');
  };
}

/* ===================== FAKS ===================== */
function renderFaks() {
  setHeader('Faks', 'Predmeti i rokovi');
  const today = todayStr();
  const upcoming = state.events.filter(e => e.cat === 'faks' && e.date >= today && !e.done)
    .sort((a, b) => a.date.localeCompare(b.date) || sortEvents(a, b)).slice(0, 6);

  const cards = state.subjects.map(s => {
    const next = state.events.filter(e => e.subjectId === s.id && e.date >= today && !e.done).sort((a, b) => a.date.localeCompare(b.date))[0];
    return `<button class="scard" data-sid="${s.id}" style="background:linear-gradient(160deg, ${hexA(s.color,.14)}, transparent 70%), var(--surface)">
      <span class="stripe" style="background:${s.color}"></span>
      <div class="nm">${esc(s.name)}</div>
      <div class="mt">${next ? `${esc(next.title)} · <span style="color:${s.color};font-weight:650">${countdown(next.date)}</span>` : 'Nema nadolazećih rokova'}</div>
    </button>`;
  }).join('');

  view.innerHTML = `
    <div class="sec-head" style="margin-top:6px"><span class="section-title">Nadolazeći rokovi</span></div>
    <div class="card tight">${upcoming.length ? upcoming.map(e => eventRow(e, true, true)).join('') : `<div class="empty">Nema rokova. Dodaj ispite i kolokvije na +</div>`}</div>
    <div class="sec-head"><span class="section-title">Predmeti</span><button class="link-btn" id="addSubj">+ Predmet</button></div>
    ${state.subjects.length ? `<div class="grid2">${cards}</div>` : `<div class="card"><div class="empty">Dodaj svoje predmete. Svaki ima svoje rokove i bilješke.</div></div>`}
  `;
  document.getElementById('addSubj').onclick = () => openSubjectSheet();
  view.querySelectorAll('[data-sid]').forEach(b => b.onclick = () => { ui.subject = b.dataset.sid; window.scrollTo(0, 0); render(); });
  bindEventRows();
}

function renderSubject() {

  setHeader(s.name, 'Predmet', { back: true, btn: { ico: 'pencil', label: 'Uredi predmet', onclick: () => openSubjectSheet(s) } });
  const evs = state.events.filter(e => e.subjectId === s.id);
  const today = todayStr();
  const up = evs.filter(e => e.date >= today).sort((a, b) => a.date.localeCompare(b.date) || sortEvents(a, b));
  const past = evs.filter(e => e.date < today).sort((a, b) => b.date.localeCompare(a.date));

  view.innerHTML = `
    <div class="sec-head" style="margin-top:6px"><span class="section-title">Rokovi</span><button class="link-btn" id="addRok">+ Rok</button></div>

      ${up.length ? up.map(e => eventRow(e, true, true)).join('') : `<div class="empty">Nema nadolazećih rokova.</div>`}
      ${past.length ? `<div class="date-head">Prošlo</div>${past.map(e => eventRow(e, true)).join('')}` : ''}

    <div class="sec-head"><span class="section-title">Bilješke</span><span class="note" id="savedNote" style="margin:0"></span></div>
    <div class="card"><textarea class="notes-area" id="notes" placeholder="Gradivo, što trebam ponoviti, linkovi, dojmovi s predavanja…">${esc(s.notes || '')}</textarea></div>

function openSubjectSheet(existing) {

/* ===================== PROJEKTI ===================== */
function projectCard(p) {
  const todos = p.todos || [], ideas = p.ideas || [];
  const doneT = todos.filter(t => t.done).length;
  const meta = [ideas.length ? `💡 ${ideas.length}` : null, todos.length ? `✓ ${doneT}/${todos.length}` : null, p.updated ? `ažurirano ${shortDate(ymd(new Date(p.updated)))}` : null].filter(Boolean).join('  ·  ');
  return `<button class="pcard" data-pid="${p.id}">
    <span class="emoji" style="background:${hexA(p.color,.18)}">${esc(p.emoji || '✨')}</span>
    <div style="flex:1;min-width:0">
      <div class="nm">${esc(p.name)}</div>
      <div class="st">${p.status ? esc(p.status) : '<span style="color:var(--muted)">Još nisi zapisala na čemu si.</span>'}</div>
      ${meta ? `<div class="mt">${meta}</div>` : ''}
    </div>
  </button>`;
}

function renderProjects() {
  setHeader('Projekti', 'Ideje, napredak i zadaci');
  const active = state.projects.filter(p => !p.archived).sort((a, b) => (b.updated || 0) - (a.updated || 0));
  const archived = state.projects.filter(p => p.archived);
  view.innerHTML = `
    <div class="quick" style="margin-top:0;margin-bottom:14px">
      <button id="q-idea">${icon('bulb', 16)} Brza ideja</button>
    </div>
    ${active.length ? active.map(projectCard).join('') : `<div class="card"><div class="empty">Dodaj svoje projekte na +, npr. Out There ili šivanje.</div></div>`}
    ${state.inbox.length ? `
      <div class="sec-head"><span class="section-title">Ideje bez projekta</span></div>
      <div class="card tight">${state.inbox.map(i => ideaRow(i)).join('')}</div>` : ''}
    ${archived.length ? `<div class="sec-head"><span class="section-title">Arhiva</span></div>${archived.map(projectCard).join('')}` : ''}
  `;

function ideaRow(i) {
  return `<button class="item" data-idea="${i.id}">
    <span class="cat-ico" style="background:rgba(253,230,138,.12);color:#fde68a">${icon('bulb', 18)}</span>
    <div class="main"><div class="title wrap">${esc(i.text)}</div><div class="meta">${shortDate(i.date)}</div></div>
  </button>`;
}

function touch(p) { p.updated = Date.now(); }

function renderProject() {
  const p = projectById(ui.project);
  if (!p) { ui.project = null; return render(); }
  p.notes ||= []; p.ideas ||= []; p.todos ||= [];
  setHeader(`${p.emoji || '✨'} ${p.name}`, p.archived ? 'Projekt · arhiviran' : 'Projekt', { back: true, btn: { ico: 'pencil', label: 'Uredi projekt', onclick: () => openProjectSheet(p) } });

  const seg = ui.projSeg;
  let body = '';
  if (seg === 'dnevnik') {
    const notes = p.notes.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
    body = notes.length ? `<div class="card tight">${notes.map(n => `<button class="log" data-note="${n.id}"><div class="d">${niceDate(n.date)}</div><div class="t">${esc(n.text)}</div></button>`).join('')}</div>`
      : `<div class="card"><div class="empty">Ovdje zapisuj što si napravila. Na + dodaješ novi zapis.</div></div>`;
  } else if (seg === 'ideje') {
    body = p.ideas.length ? `<div class="card tight">${p.ideas.slice().reverse().map(i => ideaRow(i)).join('')}</div>`
      : `<div class="card"><div class="empty">Svaka ideja ide ovdje, čak i ona napola gotova 💡</div></div>`;
  } else {
    const todos = p.todos.slice().sort((a, b) => (a.done - b.done) || (a.created || 0) - (b.created || 0));
    body = todos.length ? `<div class="card tight">${todos.map(t => `<div class="item ${t.done ? 'done' : ''}" data-todo="${t.id}">
        <span class="check ${t.done ? 'on' : ''}">${t.done ? icon('check', 14, 3) : ''}</span>
        <div class="main"><div class="title wrap">${esc(t.text)}</div></div></div>`).join('')}</div>`
      : `<div class="card"><div class="empty">Nema zadataka. Dodaj ih na +</div></div>`;
  }

  view.innerHTML = `
    <button class="card status-card" id="status" style="background:linear-gradient(160deg, ${hexA(p.color,.18)}, transparent 70%), var(--surface)">
      <div class="section-title" style="color:${p.color}">Na čemu sam</div>
      <div class="txt ${p.status ? '' : 'ph'}">${p.status ? esc(p.status) : 'Dodirni i zapiši gdje si stala i što je sljedeći korak…'}</div>
      ${p.updated ? `<div class="note" style="margin:8px 0 0">Ažurirano ${niceDate(ymd(new Date(p.updated))).toLowerCase()}</div>` : ''}
    </button>
    <div class="seg" id="pseg">
      <button data-s="dnevnik" class="${seg === 'dnevnik' ? 'on' : ''}">Dnevnik</button>
      <button data-s="ideje" class="${seg === 'ideje' ? 'on' : ''}">Ideje${p.ideas.length ? ` (${p.ideas.length})` : ''}</button>
      <button data-s="zadaci" class="${seg === 'zadaci' ? 'on' : ''}">Zadaci${p.todos.length ? ` (${p.todos.filter(t => !t.done).length})` : ''}</button>
    </div>
    ${body}
  `;

  document.getElementById('status').onclick = () => openTextSheet('Na čemu sam', p.status || '', 'Gdje si stala, što radiš sad, što je sljedeće…', v => { p.status = v; touch(p); });
  document.getElementById('pseg').onclick = ev => { const b = ev.target.closest('[data-s]'); if (b) { ui.projSeg = b.dataset.s; render(); } };
  view.querySelectorAll('[data-note]').forEach(b => b.onclick = () => {
    const n = p.notes.find(x => x.id === b.dataset.note); if (!n) return;
    openNoteSheet(p, n);
  });
  view.querySelectorAll('[data-idea]').forEach(b => b.onclick = () => { const i = p.ideas.find(x => x.id === b.dataset.idea); if (i) openIdeaSheet(i, p.id); });
  view.querySelectorAll('[data-todo]').forEach(el => el.onclick = ev => {
    const t = p.todos.find(x => x.id === el.dataset.todo); if (!t) return;
    if (ev.target.closest('.check')) { t.done = !t.done; touch(p); save(); render(); }
    else openTextSheet('Uredi zadatak', t.text, '', v => { t.text = v; touch(p); }, () => { p.todos = p.todos.filter(x => x.id !== t.id); touch(p); }, true);
  });
}

function openNoteSheet(p, existing) {
  openSheet(existing ? 'Uredi zapis' : 'Novi zapis', `
    <div class="field"><label>Datum</label><input id="f-date" type="date" value="${existing ? existing.date : todayStr()}"></div>
    <div class="field"><label>Što sam napravila</label><textarea id="f-text" placeholder="npr. Složila wireframe za passport ekran, javila se dizajnerici…">${esc(existing ? existing.text : '')}</textarea></div>

    const date = document.getElementById('f-date').value || todayStr();

  };

function openIdeaSheet(existing, fromProjectId) {
  const curProj = existing ? (fromProjectId || '') : (ui.tab === 'projekti' && ui.project ? ui.project : '');
  let target = curProj;
  const opts = [{ id: '', name: 'Bez projekta', emoji: '📥' }, ...state.projects.filter(p => !p.archived)];
  openSheet(existing ? 'Ideja' : 'Nova ideja', `
    <div class="field"><label>Ideja</label><textarea id="f-text" placeholder="Zapiši dok ne pobjegne…">${esc(existing ? existing.text : '')}</textarea></div>
    <div class="field"><label>Projekt</label><div class="chips" id="f-proj">${opts.map(p => `<button class="chip ${p.id === target ? 'on' : ''}" data-id="${p.id}">${esc(p.emoji || '✨')} ${esc(p.name)}</button>`).join('')}</div></div>
    <button class="btn" id="f-save">Spremi</button>
    ${existing ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  document.getElementById('f-proj').onclick = ev => {
    const b = ev.target.closest('[data-id]'); if (!b) return;
    target = b.dataset.id; document.querySelectorAll('#f-proj .chip').forEach(x => x.classList.toggle('on', x === b));
  };
  if (!existing) setTimeout(() => document.getElementById('f-text').focus(), 280);
  const listOf = id => id ? projectById(id).ideas ||= [] : state.inbox;
  const removeFrom = (id, idea) => { if (id) { const p = projectById(id); p.ideas = p.ideas.filter(x => x.id !== idea.id); } else state.inbox = state.inbox.filter(x => x.id !== idea.id); };
  document.getElementById('f-save').onclick = () => {
    const text = document.getElementById('f-text').value.trim(); if (!text) return toast('Upiši ideju');
    if (existing) {
      existing.text = text;
      if (target !== curProj) { removeFrom(curProj, existing); listOf(target).push(existing); }
    } else listOf(target).push({ id: uid(), text, date: todayStr() });
    if (target) touch(projectById(target));
    save(); closeSheet(); render(); toast('Ideja spremljena 💡');
  };
  if (existing) document.getElementById('f-del').onclick = () => {
    if (!confirm('Obrisati ovu ideju?')) return;
    removeFrom(curProj, existing); save(); closeSheet(); render();
  };
}

function openTextSheet(title, value, placeholder, onSave, onDelete, small) {
  openSheet(title, `
    <div class="field"><textarea id="f-text" placeholder="${esc(placeholder)}" style="${small ? 'min-height:80px' : 'min-height:160px'}">${esc(value)}</textarea></div>
    <button class="btn" id="f-save">Spremi</button>
    ${onDelete ? `<button class="btn danger" id="f-del">Obriši</button>` : ''}
  `);
  setTimeout(() => { const t = document.getElementById('f-text'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }, 280);
  document.getElementById('f-save').onclick = () => { const v = document.getElementById('f-text').value.trim(); if (small && !v) return toast('Upiši tekst'); onSave(v); save(); closeSheet(); render(); toast('Spremljeno'); };
  if (onDelete) document.getElementById('f-del').onclick = () => { onDelete(); save(); closeSheet(); render(); };
}

function swatches(cur) { return `<div class="swatches" id="f-color">${PALETTE.map(c => `<button class="${c === cur ? 'on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div>`; }
function bindSwatches(cb) {
  document.getElementById('f-color').onclick = ev => {
    const b = ev.target.closest('[data-c]'); if (!b) return;
    cb(b.dataset.c); document.querySelectorAll('#f-color button').forEach(x => x.classList.toggle('on', x === b));
  };
}

      <div class="note">Iznosi u eurima. Ostavi prazno ako ne želiš limit.</div>
    </div>
    <div class="sec-head"><span class="section-title">Sigurnosna kopija</span></div>
    <div class="card">
      <button class="btn ghost" id="exp">Izvezi backup</button>
      <button class="btn ghost" id="imp">Uvezi backup</button>
      <input type="file" id="impFile" accept="application/json,.json" style="display:none">
      <div class="note">Podaci su spremljeni samo na ovom uređaju. Napravi backup svakih par tjedana i spremi ga u iCloud Drive (Datoteke).</div>
    </div>
    <div class="sec-head"><span class="section-title">Opasna zona</span></div>
    <div class="card"><button class="btn danger" id="wipe" style="margin:0">Obriši sve podatke</button></div>
  `;
  view.querySelectorAll('[data-lim]').forEach(inp => inp.onchange = () => {
    const v = parseAmount(inp.value);
    if (v > 0) state.budgets[inp.dataset.lim] = v; else delete state.budgets[inp.dataset.lim];
    save(); toast('Limit spremljen');
  });
  document.getElementById('exp').onclick = exportBackup;
  document.getElementById('imp').onclick = () => document.getElementById('impFile').click();
  document.getElementById('impFile').onchange = importBackup;
  document.getElementById('wipe').onclick = () => {
    if (!confirm('Sigurno obrisati SVE podatke?')) return;
    if (!confirm('Ovo se ne može vratiti. Nastaviti?')) return;
    state = emptyState(); save(); render(); toast('Sve obrisano');
  };
}
async function exportBackup() {
  const json = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
  const name = `planer-backup-${todayStr()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Planer backup' }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importBackup(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.events) || !Array.isArray(d.tx)) throw new Error('format');
      if (!confirm('Uvesti backup? Trenutni podaci bit će zamijenjeni.')) return;
      delete d.exportedAt; state = Object.assign(emptyState(), d, { version: 2 }); save(); render(); toast('Backup uvezen');
    } catch (e) { toast('Neispravna datoteka'); }
    ev.target.value = '';
  };
  r.readAsText(f);
}

  if (ui.tab === 'kalendar') openEventSheet();
  else if (ui.tab === 'financije') openTxSheet();
  else if (ui.tab === 'faks') openEventSheet(null, { cat: 'faks', subjectId: ui.subject || '', date: todayStr() });
  else if (ui.tab === 'projekti') {
    const p = ui.project && projectById(ui.project);
    if (!p) openProjectSheet();
    else if (ui.projSeg === 'dnevnik') openNoteSheet(p);
    else if (ui.projSeg === 'ideje') openIdeaSheet();
    else openTextSheet('Novi zadatak', '', 'npr. Napraviti logo', v => { p.todos.push({ id: uid(), text: v, done: false, created: Date.now() }); touch(p); }, null, true);
  }
};

render();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
